name: Patch Preflight (strict context)

on:
  push:
    branches:
      - lineage-24.0
    paths:
      - 'lemonadep.kernel-new.patch'
      - 'lemonadep.sukisu-new.patch'
      - '.github/workflows/validate-patches.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-preflight:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v5

      - name: Checkout LineageOS kernel source
        uses: actions/checkout@v5
        with:
          repository: LineageOS/android_kernel_oneplus_sm8350
          ref: lineage-24.0
          path: kernel_source
          fetch-depth: 1

      - name: Checkout SukiSU builtin-new
        uses: actions/checkout@v5
        with:
          repository: SukiSU-Ultra/SukiSU-Ultra
          ref: builtin-new
          path: KernelSU
          fetch-depth: 1

      - name: Strict dry-run and apply kernel patch
        run: |
          set -euo pipefail
          cd kernel_source
          echo "Kernel source commit: $(git rev-parse HEAD)"
          patch --version | head -n 1
          patch --dry-run --batch --forward --fuzz=0 -p1 < "${GITHUB_WORKSPACE}/lemonadep.kernel-new.patch"
          patch --batch --forward --fuzz=0 -p1 < "${GITHUB_WORKSPACE}/lemonadep.kernel-new.patch"
          git diff --check
          echo "KERNEL_PATCH_PREFLIGHT=PASS"

      - name: Strict dry-run and apply SukiSU patch
        run: |
          set -euo pipefail
          cd KernelSU
          echo "SukiSU builtin-new commit: $(git rev-parse HEAD)"
          patch --dry-run --batch --forward --fuzz=0 -p1 < "${GITHUB_WORKSPACE}/lemonadep.sukisu-new.patch"
          patch --batch --forward --fuzz=0 -p1 < "${GITHUB_WORKSPACE}/lemonadep.sukisu-new.patch"
          git diff --check
          echo "SUKISU_PATCH_PREFLIGHT=PASS"
