name: Integrated SukiSU Ultra builtin-new + SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash   # 等价于 bash -eo pipefail，任何命令失败都会立刻停止
    steps:
      # 1. 腾出编译空间
      - name: "1. Maximize Build Space"
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048

      # 2. 签出当前仓库：workflow 和所有 patch 文件都在仓库根目录
      - name: "2. Checkout Patch Repository"
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # 3. 拉取 LineageOS 内核源码
      - name: "3. Checkout Kernel Source"
        uses: actions/checkout@v5
        with:
          repository: LineageOS/android_kernel_oneplus_sm8350
          ref: lineage-24.0
          path: kernel_source
          fetch-depth: 1

      # 4. 拉取官方 Clang 工具链
      - name: Setup Google Clang
        run: |
          mkdir -p toolchain/clang
          curl -L "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel/clang-r614150.tar.gz" | tar -xz -C toolchain/clang
          echo "${GITHUB_WORKSPACE}/toolchain/clang/bin" >> "$GITHUB_PATH"
          
      # 5. 内核侧补丁（SUSFS + Hook + SELinuxFS + seccomp 例外 + binder freezer）。
      #    必须先于 SukiSU 接入，因为会改 drivers/Makefile。
      - name: "5. Apply kernel patches"
        run: |
          cd kernel_source
          patch -p1 --fuzz=0 < "${GITHUB_WORKSPACE}/lemonadep.kernel-new.patch"
          patch -p1 --fuzz=0 < "${GITHUB_WORKSPACE}/binder-freezer-enable.patch"

      # 6. 接入固定版本的 SukiSU builtin-new，并应用 5.4 适配补丁
      - name: "6. Integrate SukiSU"
        run: |
          KSU="${GITHUB_WORKSPACE}/kernel_source/KernelSU"

          git init "$KSU"
          git -C "$KSU" fetch --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git 0804a40956b4345fa5ce392170a907e174d402f0
          git -C "$KSU" checkout --detach FETCH_HEAD

          cd "${GITHUB_WORKSPACE}/kernel_source"
          ln -s ../KernelSU/kernel drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          patch -d "$KSU" -p1 --fuzz=0 < "${GITHUB_WORKSPACE}/lemonadep.sukisu-new.patch"
            
      # 7. 配置 + 检查 + 编译
      - name: "7. Configure and build kernel"
        run: |
          cd kernel_source
          OUT="${GITHUB_WORKSPACE}/out"
          DEFCONFIG="arch/arm64/configs/vendor/lahaina-qgki_defconfig"

          cat << 'EOF' >> "$DEFCONFIG"

          # SukiSU / SUSFS
          CONFIG_RPS=y
          CONFIG_BOOT_CONFIG=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_KSU=y
          CONFIG_KSU_FEATURE_ADBROOT=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_INLINE_HOOK=y
          CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_DEBUG_KERNEL=y
          CONFIG_KALLSYMS=y
          # KPM 不启用
          # CONFIG_KPM is not set
          CONFIG_SECURITY_YAMA=y
          CONFIG_NTFS_FS=y
          EOF

          MAKE_ARGS=(
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CC=clang
            KCFLAGS="-Wno-unused-function"
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            LOCALVERSION=-RONOVA
            O="$OUT"
          )

          make "${MAKE_ARGS[@]}" vendor/lahaina-qgki_defconfig
          make "${MAKE_ARGS[@]}" olddefconfig

          # olddefconfig 会悄悄丢掉未定义的选项，编译前确认关键项还在，避免白编译一遍
          for cfg in CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_KSU_SUSFS_SUS_PATH \
                     CONFIG_KSU_SUSFS_SUS_MAP CONFIG_KSU_SUSFS_SUS_MOUNT \
                     CONFIG_KSU_SUSFS_SUS_KSTAT CONFIG_KSU_SUSFS_INLINE_HOOK \
                     CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER CONFIG_KSU_SUSFS_OPEN_REDIRECT \
                     CONFIG_KSU_SUSFS_SPOOF_UNAME CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
                     CONFIG_KSU_SUSFS_ENABLE_LOG CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                     CONFIG_NET CONFIG_SECCOMP CONFIG_SECCOMP_FILTER \
                     CONFIG_NTFS_FS CONFIG_SECURITY_YAMA \
                     CONFIG_SECURITY CONFIG_SECURITY_SELINUX CONFIG_SECURITYFS \
                     CONFIG_KALLSYMS CONFIG_KALLSYMS_ALL; do
            grep -qx "${cfg}=y" "$OUT/.config" || { echo "缺少配置: ${cfg}=y"; exit 1; }
          done

          # prepare/scripts 单线程先跑一遍，避免并行编译时的竞争问题
          make "${MAKE_ARGS[@]}" -j1 prepare
          make "${MAKE_ARGS[@]}" -j1 scripts
          make "${MAKE_ARGS[@]}" -j"$(nproc)"

          # 将本次构建的模块安装到独立暂存目录；只在打包时复制 .ko，
          # 不覆盖设备原有的 modules.load / modules.dep 等厂商元数据。
          MODULES_STAGE="${GITHUB_WORKSPACE}/modules_stage"
          KERNELRELEASE="$(make "${MAKE_ARGS[@]}" -s kernelrelease)"
          make "${MAKE_ARGS[@]}" \
            INSTALL_MOD_PATH="$MODULES_STAGE" \
            INSTALL_MOD_STRIP=1 \
            DEPMOD=/bin/true \
            modules_install

          MODULES_SRC="$MODULES_STAGE/lib/modules/$KERNELRELEASE"
          test -d "$MODULES_SRC" || { echo "模块安装目录不存在: $MODULES_SRC"; exit 1; }
          KO_COUNT="$(find "$MODULES_SRC" -type f -name '*.ko' | wc -l)"
          test "$KO_COUNT" -gt 0 || { echo "没有安装出任何 .ko 模块"; exit 1; }
          echo "KERNELRELEASE=$KERNELRELEASE" >> "$GITHUB_ENV"
          echo "已安装 $KO_COUNT 个内核模块，版本: $KERNELRELEASE"

      # 8. 打包 AnyKernel3
      - name: "8. Pack with AnyKernel3"
        run: |
          git clone --depth=1 https://github.com/huaiding230-code/AnyKernel3.git AnyKernel3
          cd AnyKernel3
          BOOT="${GITHUB_WORKSPACE}/out/arch/arm64/boot"
          MODULES_SRC="${GITHUB_WORKSPACE}/modules_stage/lib/modules/${KERNELRELEASE}"
          MODULES_DEST="${GITHUB_WORKSPACE}/AnyKernel3/modules/vendor/lib/modules"

          if [ -f "$BOOT/Image" ]; then
             cp "$BOOT/Image" .
          else
             echo "未找到内核 Image"
             exit 1
          fi

          # 按 Kbuild modules_install 的相对目录结构打包所有 .ko。
          # Android 统一通过 /vendor/lib/modules 访问 vendor_dlkm 模块。
          mkdir -p "$MODULES_DEST"
          KO_COUNT=0
          while IFS= read -r -d '' module; do
            relative="${module#"$MODULES_SRC"/}"
            install -D -m 0644 "$module" "$MODULES_DEST/$relative"
            KO_COUNT=$((KO_COUNT + 1))
          done < <(find "$MODULES_SRC" -type f -name '*.ko' -print0)

          test "$KO_COUNT" -gt 0 || { echo "AnyKernel 模块目录为空"; exit 1; }
          test -s "$MODULES_DEST/kernel/techpack/display/msm/msm_drm.ko" || {
            echo "缺少修复后的 msm_drm.ko"; exit 1;
          }

          # 启用 AnyKernel3 的 KernelSU systemless helper；
          # 不直接写只读 vendor_dlkm 分区。
          sed -i 's/^do.modules=0$/do.modules=1/' anykernel.sh
          grep -q '^do.modules=1

      # 9. 上传刷机包
      - name: "9. Upload Kernel Zip Artifact"
        uses: actions/upload-artifact@v7
        with:
          name: SukiSU-SUSFS-Kernel
          path: SukiSU-SUSFS-Kernel-OP9P.zip
          archive: false
 anykernel.sh
          grep -q '^do.systemless=1

      # 9. 上传刷机包
      - name: "9. Upload Kernel Zip Artifact"
        uses: actions/upload-artifact@v7
        with:
          name: SukiSU-SUSFS-Kernel
          path: SukiSU-SUSFS-Kernel-OP9P.zip
          archive: false
 anykernel.sh

          echo "已打包 $KO_COUNT 个 .ko 模块"
          unzip -l "${GITHUB_WORKSPACE}/SukiSU-SUSFS-Kernel-OP9P.zip" >/dev/null 2>&1 || true
          zip -r9 "${GITHUB_WORKSPACE}/SukiSU-SUSFS-Kernel-OP9P.zip" * -x README.md '*placeholder'
          unzip -l "${GITHUB_WORKSPACE}/SukiSU-SUSFS-Kernel-OP9P.zip" | grep -F 'modules/vendor/lib/modules/kernel/techpack/display/msm/msm_drm.ko'

      # 9. 上传刷机包
      - name: "9. Upload Kernel Zip Artifact"
        uses: actions/upload-artifact@v7
        with:
          name: SukiSU-SUSFS-Kernel
          path: SukiSU-SUSFS-Kernel-OP9P.zip
          archive: false
