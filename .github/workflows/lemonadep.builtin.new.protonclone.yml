name: Integrated SukiSU Ultra builtin-new + SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash

    steps:
      # 1. 腾出编译空间
      - name: "1. Maximize Build Space"
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048

      # 2. 签出当前仓库：workflow 和所有 patch 文件都在仓库根目录
      - name: "2. Checkout Patch Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 3. 拉取 LineageOS 内核源码
      - name: "3. Checkout Kernel Source"
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_oneplus_sm8350
          ref: lineage-24.0
          path: kernel_source
          fetch-depth: 1

      # 4. 下载 Neutron Clang
      - name: "4. Setup Neutron Clang Toolchain"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zstd

          TOOLCHAIN="${GITHUB_WORKSPACE}/toolchain/neutron-clang"
          mkdir -p "$TOOLCHAIN"

          curl -fL \
            "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst" \
            -o "${RUNNER_TEMP}/neutron-clang.tar.zst"

          tar -I zstd -xf "${RUNNER_TEMP}/neutron-clang.tar.zst" -C "$TOOLCHAIN"

          test -x "$TOOLCHAIN/bin/clang"
          "$TOOLCHAIN/bin/clang" --version

          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"

      # 5. 内核侧补丁
      - name: "5. Apply kernel patches"
        run: |
          cd kernel_source
          patch -p1 --fuzz=0 < "${GITHUB_WORKSPACE}/lemonadep.kernel-new.patch"
          patch -p1 --fuzz=0 < "${GITHUB_WORKSPACE}/binder-freezer-enable.patch"

      # 6. 集成 SukiSU builtin-new
      - name: "6. Integrate SukiSU"
        run: |
          KSU="${GITHUB_WORKSPACE}/kernel_source/KernelSU"

          git init "$KSU"
          # 旧固定提交（回退用）: c105589f7a64de73d46a910248b25150226e2d69
          git -C "$KSU" fetch --depth=1 \
            https://github.com/SukiSU-Ultra/SukiSU-Ultra.git \
            0804a40956b4345fa5ce392170a907e174d402f0
          git -C "$KSU" checkout --detach FETCH_HEAD

          cd "${GITHUB_WORKSPACE}/kernel_source"

          ln -sfn ../KernelSU/kernel drivers/kernelsu

          grep -Fq 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile

          grep -Fq 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || \
            sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          cd KernelSU
          patch -p1 --fuzz=0 < "${GITHUB_WORKSPACE}/lemonadep.sukisu-new.patch"

      # 7. 配置并编译内核
      - name: "7. Configure and build kernel"
        run: |
          cd kernel_source

          OUT="${GITHUB_WORKSPACE}/out"
          DEFCONFIG="arch/arm64/configs/vendor/lahaina-qgki_defconfig"

          cat << 'EOF' >> "$DEFCONFIG"
          # SukiSU / SUSFS
          CONFIG_RPS=y
          CONFIG_BOOT_CONFIG=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_KSU=y
          CONFIG_KSU_FEATURE_ADBROOT=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_INLINE_HOOK=y
          CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          # CPU Spoof 需要在运行时解析内核符号
          CONFIG_DEBUG_KERNEL=y
          CONFIG_KALLSYMS=y
          # KPM 不启用
          # CONFIG_KPM is not set
          # 精简调试：关掉用不上的调度器调试统计
          # CONFIG_SCHED_DEBUG is not set
          EOF

          MAKE_ARGS=(
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CC=clang
            KCFLAGS="-Wno-unused-function"
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
            LOCALVERSION=-RONOVA
            O="$OUT"
          )

          make "${MAKE_ARGS[@]}" vendor/lahaina-qgki_defconfig
          make "${MAKE_ARGS[@]}" olddefconfig

          make "${MAKE_ARGS[@]}" -j1 prepare
          make "${MAKE_ARGS[@]}" -j1 scripts
          make "${MAKE_ARGS[@]}" -j"$(nproc)"

      # 8. 打包 AnyKernel3
      - name: "8. Pack with AnyKernel3"
        run: |
          git clone --depth=1 \
            https://github.com/huaiding230-code/AnyKernel3.git \
            AnyKernel3

          cd AnyKernel3
          rm -rf .git README.md *placeholder

          OUT="${GITHUB_WORKSPACE}/out/arch/arm64/boot"

          if [[ -f "${OUT}/Image.gz-dtb" ]]; then
            cp "${OUT}/Image.gz-dtb" .
          elif [[ -f "${OUT}/Image" ]]; then
            cp "${OUT}/Image" .
          else
            echo "Kernel image not found"
            exit 1
          fi

          zip -r9 "${GITHUB_WORKSPACE}/RONOVA-lemonadep-AnyKernel3.zip" \
            * -x .git README.md '*placeholder'

      # 9. 上传编译产物
      - name: "9. Upload Kernel Zip Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: RONOVA-lemonadep-AnyKernel3
          path: RONOVA-lemonadep-AnyKernel3.zip
          if-no-files-found: error
