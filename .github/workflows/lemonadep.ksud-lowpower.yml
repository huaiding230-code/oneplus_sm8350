name: Build KSUD Low-Power Fix Module

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-24.0
    paths:
      - lemonadep.ksud-lowpower.patch
      - .github/workflows/lemonadep.ksud-lowpower.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v5
        with:
          ref: lineage-24.0
          fetch-depth: 1

      - name: Checkout exact SukiSU-Nova userspace source
        uses: actions/checkout@v5
        with:
          repository: SukiSU-Nova/SukiSU-Nova
          ref: c60f21b9e00e35e898f8d21e0612465b76b9beec
          path: sukisu_source
          fetch-depth: 0

      - name: Apply and verify event-driven low-power patch
        run: |
          set -euo pipefail
          cd sukisu_source
          test "$(git rev-parse HEAD)" = "c60f21b9e00e35e898f8d21e0612465b76b9beec"
          test "$(git rev-parse HEAD:userspace/ksud/src/temporary_root.rs)" = "137f37a47225e1b99ceae1ce8d244e2ab91852ee"
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          KSUD_VERSION_CODE="$((30000 - 4001 + COMMIT_COUNT))"
          echo "KSUD version code: $KSUD_VERSION_CODE (source commits: $COMMIT_COUNT)"
          test "$KSUD_VERSION_CODE" -eq 30000
          patch --dry-run -p1 --fuzz=0 < "${GITHUB_WORKSPACE}/lemonadep.ksud-lowpower.patch"
          patch -p1 --fuzz=0 < "${GITHUB_WORKSPACE}/lemonadep.ksud-lowpower.patch"
          grep -q 'timerfd_create' userspace/ksud/src/temporary_root.rs
          grep -q 'inotify_init1' userspace/ksud/src/temporary_root.rs
          grep -q 'CLOCK_BOOTTIME' userspace/ksud/src/temporary_root.rs
          if grep -q 'thread::sleep(Duration::from_secs(1))' userspace/ksud/src/temporary_root.rs; then
            echo "1 Hz temporary-root polling still present"
            exit 1
          fi
          git diff --check

      - name: Setup Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android --toolchain stable

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Build arm64 ksud
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          KSU_PACKAGE_NAME: com.sukisu.nova
        run: |
          set -euo pipefail
          cd sukisu_source
          source .github/scripts/setup-rust-build.sh aarch64-linux-android 26

          BUILTINS="$($CLANG_PATH --print-resource-dir)/lib/linux/libclang_rt.builtins-aarch64-android.a"
          test -f "$BUILTINS"
          export RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wno-unused-command-line-argument -C link-arg=$BUILTINS"
          cargo +stable build --locked --package ksuinit --target=aarch64-linux-android --release
          install -m 0755 target/aarch64-linux-android/release/ksuinit userspace/ksud/bin/aarch64/ksuinit
          unset RUSTFLAGS

          export RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wno-unused-command-line-argument"
          cargo +stable build --locked --target aarch64-linux-android --release --manifest-path ./userspace/ksud/Cargo.toml
          unset RUSTFLAGS
          KSUD="${GITHUB_WORKSPACE}/sukisu_source/target/aarch64-linux-android/release/ksud"
          test -s "$KSUD"
          file "$KSUD"
          readelf -h "$KSUD" | grep -q 'AArch64'

          MOD="${GITHUB_WORKSPACE}/ksud_lowpower_module"
          mkdir -p "$MOD"
          install -m 0755 "$KSUD" "$MOD/ksud"
          printf '%s\n' "SukiSU userspace source commit: c60f21b9e00e35e898f8d21e0612465b76b9beec" > "$MOD/SOURCE_COMMIT.txt"

          cat > "$MOD/module.prop" <<'EOF'
          id=ksud_lowpower_lease_watch
          name=KSUD Low-Power Lease Watcher
          version=1.0
          versionCode=1
          author=lemonadep kernel project
          description=Event-driven temporary-root lease watcher; removes 1 Hz polling and uses non-wakeup BOOTTIME timer scheduling.
          EOF

          cat > "$MOD/post-fs-data.sh" <<'EOF'
          #!/system/bin/sh
          MODDIR=${0%/*}
          SRC="$MODDIR/ksud"
          DST="/data/adb/ksud"
          BACKUP="/data/adb/ksud-lowpower.original"
          TMP="/data/adb/.ksud-lowpower.$$"
          RESTART_WATCHERS=0

          log_msg() {
              log -t ksud-lowpower "$1" 2>/dev/null || true
          }

          is_watcher() {
              IW_PID="$1"
              [ -r "/proc/$IW_PID/cmdline" ] || return 1
              IW_ARGS="$(tr '\000' ' ' < "/proc/$IW_PID/cmdline" 2>/dev/null)"
              [ -n "$IW_ARGS" ] || return 1
              set -- $IW_ARGS
              [ "${1##*/}" = "ksud" ] &&
                  [ "${2:-}" = "temporary-root" ] &&
                  [ "${3:-}" = "watch" ]
          }

          has_watcher() {
              for PROC in /proc/[0-9]*; do
                  [ -d "$PROC" ] || continue
                  is_watcher "${PROC##*/}" && return 0
              done
              return 1
          }

          stop_watchers() {
              OLD_WATCHERS=""
              for PROC in /proc/[0-9]*; do
                  [ -d "$PROC" ] || continue
                  PID=${PROC##*/}
                  if is_watcher "$PID"; then
                      kill -TERM "$PID" 2>/dev/null || true
                      OLD_WATCHERS="$OLD_WATCHERS $PID"
                  fi
              done

              for PID in $OLD_WATCHERS; do
                  COUNT=0
                  while kill -0 "$PID" 2>/dev/null && [ "$COUNT" -lt 30 ]; do
                      sleep 0.1
                      COUNT=$((COUNT + 1))
                  done
                  if kill -0 "$PID" 2>/dev/null; then
                      kill -KILL "$PID" 2>/dev/null || true
                  fi
              done

              COUNT=0
              while has_watcher && [ "$COUNT" -lt 20 ]; do
                  sleep 0.1
                  COUNT=$((COUNT + 1))
              done
              if has_watcher; then
                  log_msg "temporary-root watcher did not exit"
                  return 1
              fi
              return 0
          }

          start_watcher() {
              "$DST" temporary-root watch >/dev/null 2>&1 &
              WATCH_PID=$!
              COUNT=0
              while [ "$COUNT" -lt 30 ]; do
                  if has_watcher; then
                      return 0
                  fi
                  if ! kill -0 "$WATCH_PID" 2>/dev/null; then
                      break
                  fi
                  sleep 0.1
                  COUNT=$((COUNT + 1))
              done
              has_watcher
          }

          restore_backup() {
              [ -s "$BACKUP" ] || return 1
              cp "$BACKUP" "$TMP" || return 1
              chown 0:0 "$TMP" 2>/dev/null || true
              chmod 0755 "$TMP" || return 1
              mv -f "$TMP" "$DST" || return 1
              restorecon "$DST" 2>/dev/null || true
              return 0
          }

          [ -s "$SRC" ] && [ -x "$SRC" ] || {
              log_msg "patched ksud binary is missing"
              exit 1
          }
          [ -f "$DST" ] && [ ! -L "$DST" ] || {
              log_msg "installed ksud is not a regular file; refusing replacement"
              exit 1
          }

          # Keep a single rollback copy of the original executable.
          if [ ! -s "$BACKUP" ]; then
              cp -p "$DST" "$BACKUP" || {
                  log_msg "failed to back up the original ksud"
                  exit 1
              }
              chown 0:0 "$BACKUP" 2>/dev/null || true
              chmod 0755 "$BACKUP" || exit 1
              restorecon "$BACKUP" 2>/dev/null || true
          fi

          # Stage the new executable before touching the active worker.
          if ! cmp -s "$SRC" "$DST"; then
              cp "$SRC" "$TMP" || exit 1
              chown 0:0 "$TMP" 2>/dev/null || true
              chmod 0755 "$TMP" || exit 1

              # Stop only ksud temporary-root watch. The main ksud event daemon
              # remains alive and continues handling manager/kernel events.
              stop_watchers || {
                  rm -f "$TMP"
                  exit 1
              }

              if ! mv -f "$TMP" "$DST"; then
                  rm -f "$TMP"
                  "$DST" temporary-root watch >/dev/null 2>&1 &
                  log_msg "atomic ksud replacement failed; original watcher restarted"
                  exit 1
              fi
              restorecon "$DST" 2>/dev/null || true
              RESTART_WATCHERS=1
              log_msg "installed event-driven ksud"
          fi

          if ! has_watcher; then
              if ! start_watcher; then
                  log_msg "patched watcher failed; restoring original ksud"
                  if restore_backup; then
                      start_watcher || log_msg "original watcher also failed to start"
                  fi
                  exit 1
              fi
          fi

          log_msg "event-driven temporary-root watcher active"
          exit 0
          EOF

          cat > "$MOD/restore.sh" <<'EOF'
          #!/system/bin/sh
          DST="/data/adb/ksud"
          BACKUP="/data/adb/ksud-lowpower.original"
          TMP="/data/adb/.ksud-lowpower-restore.$$"

          log_msg() {
              log -t ksud-lowpower "$1" 2>/dev/null || true
          }

          is_watcher() {
              IW_PID="$1"
              [ -r "/proc/$IW_PID/cmdline" ] || return 1
              IW_ARGS="$(tr '\000' ' ' < "/proc/$IW_PID/cmdline" 2>/dev/null)"
              [ -n "$IW_ARGS" ] || return 1
              set -- $IW_ARGS
              [ "${1##*/}" = "ksud" ] &&
                  [ "${2:-}" = "temporary-root" ] &&
                  [ "${3:-}" = "watch" ]
          }

          has_watcher() {
              for PROC in /proc/[0-9]*; do
                  [ -d "$PROC" ] || continue
                  is_watcher "${PROC##*/}" && return 0
              done
              return 1
          }

          stop_watchers() {
              OLD_WATCHERS=""
              for PROC in /proc/[0-9]*; do
                  [ -d "$PROC" ] || continue
                  PID=${PROC##*/}
                  if is_watcher "$PID"; then
                      kill -TERM "$PID" 2>/dev/null || true
                      OLD_WATCHERS="$OLD_WATCHERS $PID"
                  fi
              done
              for PID in $OLD_WATCHERS; do
                  COUNT=0
                  while kill -0 "$PID" 2>/dev/null && [ "$COUNT" -lt 30 ]; do
                      sleep 0.1
                      COUNT=$((COUNT + 1))
                  done
                  if kill -0 "$PID" 2>/dev/null; then
                      kill -KILL "$PID" 2>/dev/null || true
                  fi
              done
              COUNT=0
              while has_watcher && [ "$COUNT" -lt 20 ]; do
                  sleep 0.1
                  COUNT=$((COUNT + 1))
              done
              if has_watcher; then
                  log_msg "temporary-root watcher did not exit"
                  return 1
              fi
              return 0
          }

          start_watcher() {
              "$DST" temporary-root watch >/dev/null 2>&1 &
              WATCH_PID=$!
              COUNT=0
              while [ "$COUNT" -lt 30 ]; do
                  if has_watcher; then
                      return 0
                  fi
                  if ! kill -0 "$WATCH_PID" 2>/dev/null; then
                      break
                  fi
                  sleep 0.1
                  COUNT=$((COUNT + 1))
              done
              has_watcher
          }

          [ -s "$BACKUP" ] && [ -x "$BACKUP" ] || {
              log_msg "original ksud backup not found; nothing restored"
              exit 0
          }

          stop_watchers || exit 1
          cp "$BACKUP" "$TMP" || exit 1
          chown 0:0 "$TMP" 2>/dev/null || true
          chmod 0755 "$TMP" || exit 1
          mv -f "$TMP" "$DST" || exit 1
          restorecon "$DST" 2>/dev/null || true

          # Retain the backup unless the original watcher is confirmed alive.
          if ! start_watcher; then
              log_msg "original watcher failed to start; rollback copy retained"
              exit 1
          fi
          rm -f "$BACKUP"
          log_msg "original ksud restored"
          exit 0
          EOF

          cat > "$MOD/uninstall.sh" <<'EOF'
          #!/system/bin/sh
          MODDIR=${0%/*}
          "$MODDIR/restore.sh"
          EOF

          cat > "$MOD/action.sh" <<'EOF'
          #!/system/bin/sh
          MODDIR=${0%/*}
          "$MODDIR/restore.sh"
          EOF

          cat > "$MOD/README.txt" <<'EOF'
          KSUD Low-Power Lease Watcher

          Target: OnePlus 9 Pro / lemonadep, LineageOS 24.0, Android 17.
          SukiSU-Nova userspace source commit:
          c60f21b9e00e35e898f8d21e0612465b76b9beec
          Source userspace temporary_root.rs blob:
          137f37a47225e1b99ceae1ce8d244e2ab91852ee

          This module replaces only /data/adb/ksud with an arm64 build from the
          matching SukiSU-Nova userspace source plus the event-driven watcher fix.
          It does not modify the kernel image or kernel configuration.

          The original executable is backed up to:
          /data/adb/ksud-lowpower.original

          The watcher uses inotify to detect lease-state file changes and a
          non-wakeup CLOCK_BOOTTIME timerfd for the next lease deadline. The
          existing 1 Hz polling loop is removed. The timer does not wake the phone
          from suspend; an expired lease is processed after the device resumes.

          The Action button and uninstall script restore the original ksud. The
          module checks the replacement watcher at startup and rolls back to the
          saved original if the patched watcher cannot start.

          Rebuild this module whenever the pinned SukiSU userspace source changes.
          Do not use the binary with another userspace build unless compatibility
          has been verified.
          EOF

          chmod 0755 "$MOD/post-fs-data.sh" "$MOD/restore.sh" "$MOD/uninstall.sh" "$MOD/action.sh"
          for SCRIPT in "$MOD/post-fs-data.sh" "$MOD/restore.sh" "$MOD/uninstall.sh" "$MOD/action.sh"; do
            sh -n "$SCRIPT"
          done
          cd "$MOD"
          zip -r9 "${GITHUB_WORKSPACE}/KSUD-Low-Power-Fix.zip" .
          unzip -tqq "${GITHUB_WORKSPACE}/KSUD-Low-Power-Fix.zip"

      - name: Upload flashable module
        uses: actions/upload-artifact@v7
        with:
          name: KSUD-Low-Power-Fix
          path: KSUD-Low-Power-Fix.zip
          if-no-files-found: error
