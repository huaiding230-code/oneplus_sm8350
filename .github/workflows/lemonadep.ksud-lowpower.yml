name: Build KSUD Low-Power Fix Module

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-24.0
    paths:
      - lemonadep.ksud-lowpower.patch
      - .github/workflows/lemonadep.ksud-lowpower.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v5
        with:
          ref: lineage-24.0
          fetch-depth: 1

      - name: Checkout exact SukiSU userspace source used by kernel build #42
        uses: actions/checkout@v5
        with:
          repository: SukiSU-Ultra/SukiSU-Ultra
          ref: 5a3ec4145059ed2c4f22c70a16a28a616e104c33
          path: sukisu_source
          fetch-depth: 0

      - name: Apply and verify event-driven low-power patch
        run: |
          set -euo pipefail
          cd sukisu_source
          test "$(git rev-parse HEAD)" = "5a3ec4145059ed2c4f22c70a16a28a616e104c33"
          patch --dry-run -p1 --fuzz=0 < "\${GITHUB_WORKSPACE}/lemonadep.ksud-lowpower.patch"
          patch -p1 --fuzz=0 < "\${GITHUB_WORKSPACE}/lemonadep.ksud-lowpower.patch"
          grep -q 'timerfd_create' userspace/ksud/src/temporary_root.rs
          grep -q 'inotify_init1' userspace/ksud/src/temporary_root.rs
          grep -q 'CLOCK_BOOTTIME' userspace/ksud/src/temporary_root.rs
          if grep -q 'thread::sleep(Duration::from_secs(1))' userspace/ksud/src/temporary_root.rs; then
            echo "1 Hz temporary-root polling still present"
            exit 1
          fi
          git diff --check

      - name: Setup Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android --toolchain stable

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Build arm64 ksud
        env:
          ANDROID_NDK_HOME: \${{ steps.ndk.outputs.ndk-path }}
          KSU_PACKAGE_NAME: com.sukisu.ultra
        run: |
          set -euo pipefail
          cd sukisu_source
          source .github/scripts/setup-rust-build.sh aarch64-linux-android 26

          BUILTINS="$($CLANG_PATH --print-resource-dir)/lib/linux/libclang_rt.builtins-aarch64-android.a"
          test -f "$BUILTINS"
          export RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wno-unused-command-line-argument -C link-arg=$BUILTINS"
          cargo +stable build --package ksuinit --target=aarch64-linux-android --release
          install -m 0755 target/aarch64-linux-android/release/ksuinit userspace/ksud/bin/aarch64/ksuinit
          unset RUSTFLAGS

          cargo +stable build --target aarch64-linux-android --release --manifest-path ./userspace/ksud/Cargo.toml
          KSUD="\${GITHUB_WORKSPACE}/sukisu_source/target/aarch64-linux-android/release/ksud"
          test -s "$KSUD"
          file "$KSUD"
          readelf -h "$KSUD" | grep -q 'AArch64'

          MOD="\${GITHUB_WORKSPACE}/ksud_lowpower_module"
          mkdir -p "$MOD"
          install -m 0755 "$KSUD" "$MOD/ksud"
          printf '%s\n' "SukiSU source commit: 5a3ec4145059ed2c4f22c70a16a28a616e104c33" > "$MOD/SOURCE_COMMIT.txt"

          cat > "$MOD/module.prop" <<'EOF'
          id=ksud_lowpower_lease_watch
          name=KSUD Low-Power Lease Watcher
          version=1.1
          versionCode=2
          author=lemonadep kernel project
          description=Event-driven temporary-root lease watcher; removes 1 Hz polling and uses non-wakeup BOOTTIME timer scheduling.
          EOF

          cat > "$MOD/post-fs-data.sh" <<'EOF'
          #!/system/bin/sh
          MODDIR=\${0%/*}
          SRC="$MODDIR/ksud"
          DST="/data/adb/ksud"
          BACKUP="/data/adb/ksud-lowpower.original"
          TMP="/data/adb/.ksud-lowpower.$$"

          log_msg() {
              log -t ksud-lowpower "$1" 2>/dev/null || true
          }

          [ -s "$SRC" ] && [ -x "$SRC" ] || {
              log_msg "patched ksud binary is missing"
              exit 1
          }
          [ -s "$DST" ] || {
              log_msg "installed ksud binary is missing; refusing to replace it"
              exit 1
          }

          # Preserve the original daemon so uninstall can restore it.
          if [ ! -s "$BACKUP" ]; then
              cp -p "$DST" "$BACKUP" || {
                  log_msg "failed to back up the original ksud"
                  exit 1
              }
              chown 0:0 "$BACKUP" 2>/dev/null || true
              chmod 0755 "$BACKUP" || exit 1
          fi

          if ! cmp -s "$SRC" "$DST"; then
              cp "$SRC" "$TMP" || exit 1
              chown 0:0 "$TMP" 2>/dev/null || true
              chmod 0755 "$TMP" || exit 1
              mv -f "$TMP" "$DST" || exit 1
              restorecon "$DST" 2>/dev/null || true
              log_msg "installed event-driven ksud"
          fi

          # Stop only the temporary-root watcher; leave the main ksud daemon untouched.
          OLD_WATCHERS=""
          for PROC in /proc/[0-9]*; do
              PID=\${PROC##*/}
              [ -r "$PROC/cmdline" ] || continue
              ARGS="$(tr '\000' ' ' < "$PROC/cmdline" 2>/dev/null)"
              [ -n "$ARGS" ] || continue
              set -- $ARGS
              [ "\${1##*/}" = "ksud" ] || continue
              [ "\${2:-}" = "temporary-root" ] && [ "\${3:-}" = "watch" ] || continue
              kill -TERM "$PID" 2>/dev/null || true
              OLD_WATCHERS="$OLD_WATCHERS $PID"
          done

          for PID in $OLD_WATCHERS; do
              COUNT=0
              while kill -0 "$PID" 2>/dev/null && [ "$COUNT" -lt 20 ]; do
                  sleep 0.1
                  COUNT=$((COUNT + 1))
              done
              if kill -0 "$PID" 2>/dev/null; then
                  kill -KILL "$PID" 2>/dev/null || true
              fi
          done

          # Start exactly one watcher using the patched daemon.
          "$DST" temporary-root watch >/dev/null 2>&1 &
          WATCH_PID=$!
          sleep 1
          if ! kill -0 "$WATCH_PID" 2>/dev/null; then
              log_msg "patched temporary-root watcher failed to start"
              exit 1
          fi
          log_msg "event-driven temporary-root watcher started"
          exit 0
          EOF

          cat > "$MOD/restore.sh" <<'EOF'
          #!/system/bin/sh
          DST="/data/adb/ksud"
          BACKUP="/data/adb/ksud-lowpower.original"
          TMP="/data/adb/.ksud-lowpower-restore.$$"

          log_msg() {
              log -t ksud-lowpower "$1" 2>/dev/null || true
          }

          [ -s "$BACKUP" ] || {
              log_msg "original ksud backup not found; nothing restored"
              exit 0
          }

          OLD_WATCHERS=""
          for PROC in /proc/[0-9]*; do
              PID=\${PROC##*/}
              [ -r "$PROC/cmdline" ] || continue
              ARGS="$(tr '\000' ' ' < "$PROC/cmdline" 2>/dev/null)"
              [ -n "$ARGS" ] || continue
              set -- $ARGS
              [ "\${1##*/}" = "ksud" ] || continue
              [ "\${2:-}" = "temporary-root" ] && [ "\${3:-}" = "watch" ] || continue
              kill -TERM "$PID" 2>/dev/null || true
              OLD_WATCHERS="$OLD_WATCHERS $PID"
          done
          for PID in $OLD_WATCHERS; do
              COUNT=0
              while kill -0 "$PID" 2>/dev/null && [ "$COUNT" -lt 20 ]; do
                  sleep 0.1
                  COUNT=$((COUNT + 1))
              done
              if kill -0 "$PID" 2>/dev/null; then
                  kill -KILL "$PID" 2>/dev/null || true
              fi
          done

          cp "$BACKUP" "$TMP" || exit 1
          chown 0:0 "$TMP" 2>/dev/null || true
          chmod 0755 "$TMP" || exit 1
          mv -f "$TMP" "$DST" || exit 1
          restorecon "$DST" 2>/dev/null || true
          rm -f "$BACKUP"

          # Restore the stock watcher so temporary-root expiry handling remains active.
          "$DST" temporary-root watch >/dev/null 2>&1 &
          log_msg "original ksud restored"
          exit 0
          EOF

          cat > "$MOD/uninstall.sh" <<'EOF'
          #!/system/bin/sh
          MODDIR=\${0%/*}
          "$MODDIR/restore.sh"
          EOF

          cat > "$MOD/action.sh" <<'EOF'
          #!/system/bin/sh
          MODDIR=\${0%/*}
          "$MODDIR/restore.sh"
          EOF

          cat > "$MOD/README.txt" <<'EOF'
          KSUD Low-Power Lease Watcher

          Target: OnePlus 9 Pro / lemonadep, LineageOS 24.0, Android 17.
          SukiSU userspace source commit:
          5a3ec4145059ed2c4f22c70a16a28a616e104c33

          This module replaces only the /data/adb/ksud userspace daemon with a
          build from the matching SukiSU source plus the event-driven lease watcher
          patch. It does not modify the kernel image or kernel configuration.

          The watcher waits for lease-file changes using inotify and for the next
          lease deadline using a non-wakeup CLOCK_BOOTTIME timerfd. It removes the
          old 1 Hz sleep/poll loop. Lease expiration still runs when the process
          resumes; the timer does not wake the device from suspend.

          The original ksud binary is backed up to:
          /data/adb/ksud-lowpower.original

          Uninstalling the module restores that original daemon. The module action
          button also restores it immediately; the active module will reapply the
          patched daemon at the next boot.

          Rebuild this module whenever the SukiSU userspace commit changes. Do not
          use it with a different SukiSU build unless the exact source commit matches.
          EOF

          chmod 0755 "$MOD/post-fs-data.sh" "$MOD/restore.sh" "$MOD/uninstall.sh" "$MOD/action.sh"
          cd "$MOD"
          zip -r9 "\${GITHUB_WORKSPACE}/KSUD-Low-Power-Fix.zip" .
          unzip -tqq "\${GITHUB_WORKSPACE}/KSUD-Low-Power-Fix.zip"

      - name: Upload flashable module
        uses: actions/upload-artifact@v7
        with:
          name: KSUD-Low-Power-Fix
          path: KSUD-Low-Power-Fix.zip
          if-no-files-found: error
