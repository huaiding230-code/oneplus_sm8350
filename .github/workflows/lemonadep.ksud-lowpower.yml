name: Build KSUD Low-Power Fix Module

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-24.0
    paths:
      - lemonadep.ksud-lowpower.patch
      - .github/workflows/lemonadep.ksud-lowpower.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v5
        with:
          ref: lineage-24.0
          fetch-depth: 1

      - name: Checkout exact SukiSU-Nova userspace source
        uses: actions/checkout@v5
        with:
          repository: SukiSU-Nova/SukiSU-Nova
          ref: c60f21b9e00e35e898f8d21e0612465b76b9beec
          path: sukisu_source
          fetch-depth: 0

      - name: Apply and verify event-driven low-power patch
        run: |
          set -euo pipefail
          cd sukisu_source
          test "$(git rev-parse HEAD)" = "c60f21b9e00e35e898f8d21e0612465b76b9beec"
          test "$(git rev-parse HEAD:userspace/ksud/src/temporary_root.rs)" = "137f37a47225e1b99ceae1ce8d244e2ab91852ee"
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          KSUD_VERSION_CODE="$((30000 - 4001 + COMMIT_COUNT))"
          echo "KSUD version code: $KSUD_VERSION_CODE (source commits: $COMMIT_COUNT)"
          test "$KSUD_VERSION_CODE" -eq 30000
          patch --dry-run -p1 --fuzz=0 < "${GITHUB_WORKSPACE}/lemonadep.ksud-lowpower.patch"
          patch -p1 --fuzz=0 < "${GITHUB_WORKSPACE}/lemonadep.ksud-lowpower.patch"
          grep -q 'timerfd_create' userspace/ksud/src/temporary_root.rs
          grep -q 'inotify_init1' userspace/ksud/src/temporary_root.rs
          grep -q 'CLOCK_BOOTTIME' userspace/ksud/src/temporary_root.rs
          if grep -q 'thread::sleep(Duration::from_secs(1))' userspace/ksud/src/temporary_root.rs; then
            echo "1 Hz temporary-root polling still present"
            exit 1
          fi
          git diff --check

      - name: Setup Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android --toolchain stable

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Build arm64 ksud
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          KSU_PACKAGE_NAME: com.sukisu.nova
        run: |
          set -euo pipefail
          cd sukisu_source
          source .github/scripts/setup-rust-build.sh aarch64-linux-android 26

          BUILTINS="$($CLANG_PATH --print-resource-dir)/lib/linux/libclang_rt.builtins-aarch64-android.a"
          test -f "$BUILTINS"
          export RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wno-unused-command-line-argument -C link-arg=$BUILTINS"
          cargo +stable build --locked --package ksuinit --target=aarch64-linux-android --release
          install -m 0755 target/aarch64-linux-android/release/ksuinit userspace/ksud/bin/aarch64/ksuinit
          unset RUSTFLAGS

          export RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wno-unused-command-line-argument"
          cargo +stable build --locked --target aarch64-linux-android --release --manifest-path ./userspace/ksud/Cargo.toml
          unset RUSTFLAGS
          KSUD="${GITHUB_WORKSPACE}/sukisu_source/target/aarch64-linux-android/release/ksud"
          test -s "$KSUD"
          file "$KSUD"
          readelf -h "$KSUD" | grep -q 'AArch64'

          MOD="${GITHUB_WORKSPACE}/ksud_lowpower_module"
          mkdir -p "$MOD"
          install -m 0755 "$KSUD" "$MOD/ksud-lowpower"
          printf '%s\n' "SukiSU userspace source commit: c60f21b9e00e35e898f8d21e0612465b76b9beec" > "$MOD/SOURCE_COMMIT.txt"

          cat > "$MOD/module.prop" <<'EOF'
          id=ksud_lowpower_lease_watch
          name=KSUD Low-Power Lease Watcher
          version=1.1
          versionCode=2
          author=lemonadep kernel project
          description=Standalone event-driven temporary-root watcher; leaves installed ksud binary unchanged.
          EOF

          cat > "$MOD/watcher-common.sh" <<'EOF'
          #!/system/bin/sh

          # Keep pathname expansion enabled: the process scanners below depend on
          # /proc/[0-9]* expanding to numeric PID directories.
          lp_is_watcher() {
              LP_NAME="$1"
              LP_PID="$2"
              [ -r "/proc/$LP_PID/cmdline" ] || return 1
              LP_ARGS="$(tr '\000' ' ' < "/proc/$LP_PID/cmdline" 2>/dev/null)"
              [ -n "$LP_ARGS" ] || return 1
              set -- $LP_ARGS
              [ "${1##*/}" = "$LP_NAME" ] &&
                  [ "${2:-}" = "temporary-root" ] &&
                  [ "${3:-}" = "watch" ]
          }

          lp_has_watcher() {
              LP_NAME="$1"
              for LP_PROC in /proc/[0-9]*; do
                  [ -d "$LP_PROC" ] || continue
                  lp_is_watcher "$LP_NAME" "${LP_PROC##*/}" && return 0
              done
              return 1
          }

          lp_stop_watchers() {
              LP_NAME="$1"
              LP_PIDS=""
              for LP_PROC in /proc/[0-9]*; do
                  [ -d "$LP_PROC" ] || continue
                  LP_PID="${LP_PROC##*/}"
                  if lp_is_watcher "$LP_NAME" "$LP_PID"; then
                      kill -TERM "$LP_PID" 2>/dev/null || true
                      LP_PIDS="$LP_PIDS $LP_PID"
                  fi
              done
              LP_COUNT=0
              while [ "$LP_COUNT" -lt 10 ]; do
                  LP_REMAIN=0
                  for LP_PID in $LP_PIDS; do
                      lp_is_watcher "$LP_NAME" "$LP_PID" && LP_REMAIN=1
                  done
                  [ "$LP_REMAIN" -eq 0 ] && break
                  sleep 1
                  LP_COUNT=$((LP_COUNT + 1))
              done
              for LP_PID in $LP_PIDS; do
                  lp_is_watcher "$LP_NAME" "$LP_PID" && kill -KILL "$LP_PID" 2>/dev/null || true
              done
              LP_COUNT=0
              while lp_has_watcher "$LP_NAME" && [ "$LP_COUNT" -lt 5 ]; do
                  sleep 1
                  LP_COUNT=$((LP_COUNT + 1))
              done
              ! lp_has_watcher "$LP_NAME"
          }

          lp_start_watcher() {
              LP_BIN="$1"
              LP_NAME="$2"
              [ -x "$LP_BIN" ] || return 1

              # Do not spawn a duplicate worker when restore/fallback is called.
              lp_has_watcher "$LP_NAME" && return 0

              "$LP_BIN" temporary-root watch >/dev/null 2>&1 &
              LP_CHILD=$!
              # A duplicate worker exits immediately when watch.lock is held.
              # Wait once before declaring startup successful.
              sleep 1
              if kill -0 "$LP_CHILD" 2>/dev/null &&
                  lp_is_watcher "$LP_NAME" "$LP_CHILD"; then
                  return 0
              fi

              kill -TERM "$LP_CHILD" 2>/dev/null || true
              return 1
          }
          EOF

          cat > "$MOD/post-fs-data.sh" <<'EOF'
          #!/system/bin/sh
          MODDIR=${0%/*}
          STOCK="/data/adb/ksud"
          WATCHER="$MODDIR/ksud-lowpower"
          . "$MODDIR/watcher-common.sh" || exit 1

          log_msg() {
              log -t ksud-lowpower "$1" 2>/dev/null || true
          }

          [ -s "$STOCK" ] && [ -x "$STOCK" ] || {
              log_msg "stock ksud missing; refusing to alter watcher state"
              exit 1
          }
          [ -s "$WATCHER" ] && [ -x "$WATCHER" ] || {
              log_msg "standalone watcher binary missing"
              exit 1
          }

          # Only the temporary-root watcher is replaced. The installed ksud
          # binary and its main event daemon are never modified.
          if ! lp_stop_watchers ksud; then
              log_msg "stock temporary-root watcher did not stop"
              exit 1
          fi
          if ! lp_stop_watchers ksud-lowpower; then
              log_msg "previous module watcher did not stop"
              lp_start_watcher "$STOCK" ksud || log_msg "stock watcher restart failed"
              exit 1
          fi
          if ! lp_start_watcher "$WATCHER" ksud-lowpower; then
              log_msg "standalone watcher failed; restoring stock watcher"
              lp_start_watcher "$STOCK" ksud || log_msg "stock watcher fallback failed"
              exit 1
          fi

          log_msg "standalone event-driven watcher active; stock ksud binary unchanged"
          exit 0
          EOF

          cat > "$MOD/restore.sh" <<'EOF'
          #!/system/bin/sh
          MODDIR=${0%/*}
          STOCK="/data/adb/ksud"
          . "$MODDIR/watcher-common.sh" || exit 1

          log_msg() {
              log -t ksud-lowpower "$1" 2>/dev/null || true
          }

          if ! lp_stop_watchers ksud-lowpower; then
              log_msg "standalone watcher did not stop"
              exit 1
          fi
          if lp_has_watcher ksud; then
              log_msg "stock watcher already active"
              exit 0
          fi
          [ -s "$STOCK" ] && [ -x "$STOCK" ] || {
              log_msg "stock ksud missing; cannot restore stock watcher"
              exit 1
          }
          if ! lp_start_watcher "$STOCK" ksud; then
              log_msg "stock watcher failed to start"
              exit 1
          fi
          log_msg "stock temporary-root watcher restored"
          exit 0
          EOF

          cat > "$MOD/uninstall.sh" <<'EOF'
          #!/system/bin/sh
          MODDIR=${0%/*}
          "$MODDIR/restore.sh"
          EOF

          cat > "$MOD/action.sh" <<'EOF'
          #!/system/bin/sh
          MODDIR=${0%/*}
          touch "$MODDIR/disable"
          "$MODDIR/restore.sh"
          EOF

          cat > "$MOD/README.txt" <<'EOF'
          KSUD Low-Power Lease Watcher

          Target: OnePlus 9 Pro / lemonadep, LineageOS 24.0, Android 17.
          SukiSU-Nova source commit:
          c60f21b9e00e35e898f8d21e0612465b76b9beec

          This is a KernelSU/SukiSU module ZIP, not an AnyKernel3 kernel ZIP.
          Install with the KernelSU/SukiSU module installer and reboot.

          Safety:
          - Does NOT replace, overwrite, or back up /data/adb/ksud.
          - Does NOT change the kernel image, kernel config, or main ksud daemon.
          - Stops only the stock temporary-root watcher process.
          - Starts a separate ksud-lowpower temporary-root watcher.
          - If the new watcher fails, attempts to restart the stock watcher.
          - Action disables this module and restores the stock watcher.
          - Uninstall also restores the stock watcher.

          Power behavior:
          - inotify reacts to lease-state directory changes.
          - CLOCK_BOOTTIME timerfd tracks the next lease deadline.
          - The timer is non-wakeup and does not wake the phone from suspend.
          - Expired leases are handled after resume; no 1 Hz polling remains.

          UAPI compatibility was checked against the builtin-new kernel source:
          UAPI v6, app-profile v4, and matching GET/SET_APP_PROFILE ioctl layouts.

          Revalidate the source and ABI after any kernel or SukiSU update.
          EOF


          chmod 0755 "$MOD/post-fs-data.sh" "$MOD/restore.sh" "$MOD/uninstall.sh" "$MOD/action.sh" "$MOD/watcher-common.sh"
          for SCRIPT in "$MOD/post-fs-data.sh" "$MOD/restore.sh" "$MOD/uninstall.sh" "$MOD/action.sh" "$MOD/watcher-common.sh"; do
            sh -n "$SCRIPT"
          done
          if grep -Eq '^[[:space:]]*set[[:space:]]+-f([[:space:]]|$)' "$MOD/watcher-common.sh"; then
            echo "watcher-common.sh must keep /proc PID glob expansion enabled"
            exit 1
          fi
          sh -c 'set -- /proc/[0-9]*; test "$#" -gt 1' || {
            echo "runner cannot expand numeric /proc PID paths"
            exit 1
          }
          cd "$MOD"
          zip -r9 "${GITHUB_WORKSPACE}/KSUD-Low-Power-Fix.zip" .
          unzip -tqq "${GITHUB_WORKSPACE}/KSUD-Low-Power-Fix.zip"

      - name: Upload flashable module
        uses: actions/upload-artifact@v7
        with:
          name: KSUD-Low-Power-Fix
          path: KSUD-Low-Power-Fix.zip
          if-no-files-found: error
