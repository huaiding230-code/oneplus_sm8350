name: SukiSU builtin-new Preflight (LineageOS 24.0)

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-24.0
    paths:
      - 'lemonadep.kernel-new.patch'
      - 'lemonadep-ipa-pm-optional-callback.patch'
      - 'lemonadep-glink-qrtr-wake-diagnostic.patch'
      - 'lemonadep.sukisu-new.patch'
      - '.github/workflows/lemonadep.builtin.full.new.yml'
      - '.github/workflows/preflight-builtin-new.yml'

permissions:
  contents: read

concurrency:
  group: builtin-new-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Apply kernel and SukiSU patches
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Checkout LineageOS kernel source
        uses: actions/checkout@v5
        with:
          repository: LineageOS/android_kernel_oneplus_sm8350
          ref: lineage-24.0
          path: kernel_source
          fetch-depth: 1

      - name: Strictly test and apply the kernel patches
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/kernel_source"

          echo "Kernel source commit: $(git rev-parse HEAD)"

          patch_path="${GITHUB_WORKSPACE}/lemonadep.kernel-new.patch"
          test -s "$patch_path"

          # The complete patch contains sequential diff sections for files
          # that are intentionally modified more than once. GNU patch --dry-run
          # does not persist the first section before checking the next one,
          # so it reports false failures. Apply once to this disposable checkout
          # with zero fuzz; this is the actual preflight application test.
          patch --batch --forward --fuzz=0 -p1 < "$patch_path"

          git -c core.whitespace=cr-at-eol diff --check
          if find . -type f -name '*.rej' -print -quit | grep -q .; then
            echo "::error::Patch application left reject files"
            exit 1
          fi

          echo "KERNEL_PATCH_APPLY=PASS"

      - name: Fetch pinned SukiSU and strictly test/apply its patch
        run: |
          set -euo pipefail
          KSU="${GITHUB_WORKSPACE}/kernel_source/KernelSU"
          SUKISU_COMMIT="caa5113efbdc4aa56eb65bdde2aeabd83cd43a52"

          git init "$KSU"
          git -C "$KSU" fetch --depth=1 https://git.zako.shirkneko.top:20004/shirkneko/SukiSU.git "$SUKISU_COMMIT"
          git -C "$KSU" checkout --detach FETCH_HEAD

          ACTUAL_SUKISU="$(git -C "$KSU" rev-parse HEAD)"
          [[ "$ACTUAL_SUKISU" == "$SUKISU_COMMIT" ]] || {
            echo "::error::Expected SukiSU $SUKISU_COMMIT but fetched $ACTUAL_SUKISU"
            exit 1
          }
          echo "SukiSU source commit: $ACTUAL_SUKISU"

          cd "$KSU"
          patch_path="${GITHUB_WORKSPACE}/lemonadep.sukisu-new.patch"
          test -s "$patch_path"
          patch --dry-run --batch --forward --fuzz=0 -p1 < "$patch_path"
          patch --batch --forward --fuzz=0 -p1 < "$patch_path"

          echo "SUKISU_PATCH_APPLY=PASS"
          echo "PREFLIGHT=PASS"
