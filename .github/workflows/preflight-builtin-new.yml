name: SukiSU builtin pinned 844782f Preflight (LineageOS 24.0)

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-24.0
    paths:
      - 'lemonadep.kernel-new.patch'
      - 'lemonadep.sukisu-new.patch'
      - '.github/workflows/lemonadep.builtin.full.new.yml'
      - '.github/workflows/preflight-builtin-new.yml'

permissions:
  contents: read

concurrency:
  group: builtin-pinned-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Strict patch and integration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Checkout LineageOS kernel source
        uses: actions/checkout@v5
        with:
          repository: LineageOS/android_kernel_oneplus_sm8350
          ref: lineage-24.0
          path: kernel_source
          fetch-depth: 1

      - name: Checkout device module manifests
        uses: actions/checkout@v5
        with:
          repository: LineageOS/android_device_oneplus_sm8350-common
          ref: lineage-24.0
          path: device_common_source
          fetch-depth: 1

      - name: Verify build inputs and SukiSU source revision
        run: |
          set -euo pipefail

          KERNEL_PATCH="${GITHUB_WORKSPACE}/lemonadep.kernel-new.patch"
          SUKISU_PATCH="${GITHUB_WORKSPACE}/lemonadep.sukisu-new.patch"
          BUILD_WORKFLOW="${GITHUB_WORKSPACE}/.github/workflows/lemonadep.builtin.full.new.yml"

          test -s "$KERNEL_PATCH"
          test -s "$SUKISU_PATCH"
          test -s "$BUILD_WORKFLOW"
          test -f "${GITHUB_WORKSPACE}/kernel_source/arch/arm64/configs/vendor/lahaina-qgki_defconfig"

          # Keep this preflight aligned with the module-image inputs consumed by the full workflow.
          DEVICE="${GITHUB_WORKSPACE}/device_common_source"
          for manifest in modules.load modules.include.recovery modules.load.recovery; do
            test -s "$DEVICE/$manifest" || { echo "Missing or empty device manifest: $manifest"; exit 1; }
          done
          test -f "$DEVICE/modules.blocklist" || { echo "Missing device manifest: modules.blocklist"; exit 1; }

          # Match the full build workflow: use the same immutable SukiSU builtin commit.
          KSU="${GITHUB_WORKSPACE}/kernel_source/KernelSU"
          SUKISU_COMMIT="844782fef3d4502e1c4712720bcc44ca18237043"
          git init "$KSU"
          git -C "$KSU" fetch --depth=1 https://git.zako.shirkneko.top:20004/shirkneko/SukiSU.git "$SUKISU_COMMIT"
          git -C "$KSU" checkout --detach FETCH_HEAD

          ACTUAL_SUKISU="$(git -C "$KSU" rev-parse HEAD)"
          [[ "$ACTUAL_SUKISU" == "$SUKISU_COMMIT" ]] || {
            echo "::error::Expected SukiSU $SUKISU_COMMIT but fetched $ACTUAL_SUKISU"
            exit 1
          }
          echo "Fetched pinned SukiSU builtin commit: $ACTUAL_SUKISU"
          echo "ACTUAL_SUKISU=$ACTUAL_SUKISU" >> "$GITHUB_ENV"

      # Preserve the real Forgejo source used by this run. This makes context
      # failures reproducible without relying on the stale GitHub mirror.
      - name: Capture current Forgejo SukiSU source files
        run: |
          set -euo pipefail
          KSU="${GITHUB_WORKSPACE}/kernel_source/KernelSU"
          SNAP="${RUNNER_TEMP}/sukisu-source"
          mkdir -p "$SNAP"
          files=(
            kernel/core/init.c
            kernel/core/unity.h
            kernel/selinux/selinux.h
            kernel/kernel_compat.h
            kernel/Makefile
            kernel/Kconfig
            kernel/extension/dynamic_sig_fallback.c
            kernel/feature/selinux_hide.c
            kernel/feature/selinux_hide.h
            kernel/feature/sucompat.c
            kernel/hook/setuid_hook.c
            kernel/manager/pkg_observer.c
            kernel/selinux/rules.c
            kernel/selinux/selinux.c
            kernel/selinux/sepolicy.c
            kernel/supercall/supercall.c
          )
          printf 'commit=%s\\n' "$(git -C "$KSU" rev-parse HEAD)" > "$SNAP/REVISION.txt"
          git -C "$KSU" grep -n 'KSU_COMPAT_USE_SELINUX_STATE' -- kernel > "$SNAP/KSU_COMPAT_USE_SELINUX_STATE.matches.txt" || true
          for file in "${files[@]}"; do
            mkdir -p "$SNAP/$(dirname "$file")"
            cp "$KSU/$file" "$SNAP/$file"
          done
          tar -czf "${RUNNER_TEMP}/sukisu-source-latest.tar.gz" -C "$SNAP" .
          echo "Captured ${#files[@]} exact source files from $(git -C "$KSU" rev-parse HEAD)"

      - name: Upload current Forgejo SukiSU source snapshot
        uses: actions/upload-artifact@v7
        with:
          name: sukisu-forgejo-source-snapshot
          path: ${{ runner.temp }}/sukisu-source-latest.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Reject truncated patch files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for name in ("lemonadep.kernel-new.patch", "lemonadep.sukisu-new.patch"):
              data = Path(name).read_bytes()
              if not data:
                  raise SystemExit(f"ERROR: {name} is empty")
              if not data.endswith(b"\n"):
                  raise SystemExit(f"ERROR: {name} is missing its final LF; patch may be truncated")
              if b"\r\n" in data:
                  raise SystemExit(f"ERROR: {name} contains CRLF line endings; expected LF")
              print(f"{name}: final LF present ({len(data)} bytes)")
          PY

      - name: Strictly dry-run and apply the kernel patch
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/kernel_source"

          echo "Kernel source commit: $(git rev-parse HEAD)"
          patch --version | head -n 1

          patch --dry-run --batch --forward --fuzz=0 -p1 < "${GITHUB_WORKSPACE}/lemonadep.kernel-new.patch"
          patch --batch --forward --fuzz=0 -p1 < "${GITHUB_WORKSPACE}/lemonadep.kernel-new.patch"

          git -c core.whitespace=cr-at-eol diff --check
          grep -Fqx 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile
          echo "KERNEL_PATCH_PREFLIGHT=PASS"

      - name: Wire SukiSU exactly as the full build workflow does
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/kernel_source"

          test -d KernelSU/kernel
          test ! -e drivers/kernelsu
          test ! -L drivers/kernelsu
          ln -s ../KernelSU/kernel drivers/kernelsu

          # Mirror lemonadep.builtin.full.new.yml; fail if its insertion point is absent or duplicated.
          grep -q '^endmenu$' drivers/Kconfig
          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          test -f drivers/kernelsu/Kconfig
          [[ "$(grep -Fxc 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig)" -eq 1 ]]
          grep -Fqx 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile
          echo "SUKISU_DRIVER_WIRING=PASS"

      - name: Strictly dry-run and apply the SukiSU 5.4 adaptation
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/kernel_source/KernelSU"

          patch --version | head -n 1
          patch --dry-run --batch --forward --fuzz=0 -p1 < "${GITHUB_WORKSPACE}/lemonadep.sukisu-new.patch"
          patch --batch --forward --fuzz=0 -p1 < "${GITHUB_WORKSPACE}/lemonadep.sukisu-new.patch"

          git diff --check
          echo "SUKISU_PATCH_PREFLIGHT=PASS"

      - name: Verify cross-tree hooks, SELinux fixes, and KPM gate
        run: |
          set -euo pipefail
          KERNEL="${GITHUB_WORKSPACE}/kernel_source"
          KSU="${KERNEL}/KernelSU/kernel"

          require_definition() {
            local pattern="$1"
            local root="$2"
            local description="$3"
            if ! grep -Rqs --include='*.c' -E "$pattern" "$root"; then
              echo "::error::Missing SukiSU implementation for kernel hook: $description"
              exit 1
            fi
            echo "FOUND: $description"
          }

          require_definition '^[[:space:]]*bool[[:space:]]+ksu_seccomp_allow_reboot[[:space:]]*\(' "$KSU" "ksu_seccomp_allow_reboot"
          require_definition '^[[:space:]]*int[[:space:]]+ksu_handle_faccessat_kernel[[:space:]]*\(' "$KSU" "ksu_handle_faccessat_kernel"
          require_definition '^[[:space:]]*int[[:space:]]+ksu_handle_stat_kernel[[:space:]]*\(' "$KSU" "ksu_handle_stat_kernel"
          require_definition '^[[:space:]]*bool[[:space:]]+ksu_su_compat_is_enabled[[:space:]]*\(' "$KSU" "ksu_su_compat_is_enabled"
          require_definition '^[[:space:]]*struct selinux_state[[:space:]]*\*[[:space:]]*ksu_selinux_hide_select_state[[:space:]]*\(' "$KSU" "ksu_selinux_hide_select_state"

          grep -Fq 'src->value == ksu_domain_type->value' "$KSU/selinux/sepolicy.c"
          grep -Fq 'effect == AVTAB_ALLOWED' "$KSU/selinux/sepolicy.c"

          # cde5ddc already starts the sdcard monitor at EVENT_BOOT_COMPLETED.
          monitor_calls="$(grep -R --include='*.c' -F 'susfs_start_sdcard_monitor_fn()' "$KSU" | wc -l | tr -d ' ')"
          [[ "$monitor_calls" -eq 1 ]] || {
            echo "::error::Expected exactly one sdcard monitor start, found $monitor_calls."
            exit 1
          }

          # On Linux 5.4, the KPM backend must remain compile-gated off.
          python3 - "$KSU/kernel_compat.h" <<'PY'
          from pathlib import Path
          import re, sys

          source = Path(sys.argv[1]).read_text()
          gate = re.search(
              r"#if\s+LINUX_VERSION_CODE\s*>=\s*KERNEL_VERSION\(5,\s*10,\s*0\)(.*?)#endif",
              source,
              re.S,
          )
          if not gate or "KSU_CAN_USE_KPM" not in gate.group(1):
              raise SystemExit("KPM compatibility gate is not restricted to Linux 5.10+")
          print("KPM_COMPAT_GATE=PASS (Linux 5.4 remains excluded)")
          PY

          echo "CROSS_TREE_HOOKS_AND_SELINUX_PREFLIGHT=PASS"

      - name: Verify build workflow Kconfig symbols are defined
        run: |
          set -euo pipefail
          ROOT="${GITHUB_WORKSPACE}/kernel_source"

          # These are the options explicitly required by lemonadep.builtin.full.new.yml.
          symbols=(
            RPS BOOT_CONFIG SECCOMP_FILTER FANOTIFY
            KSU KSU_FEATURE_ADBROOT KSU_SUSFS
            KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MAP KSU_SUSFS_SUS_MOUNT
            KSU_SUSFS_SUS_KSTAT KSU_SUSFS_INLINE_HOOK
            KSU_SUSFS_PRIORITY_UID_FILTER KSU_SUSFS_OPEN_REDIRECT
            KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG
            KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            DEBUG_KERNEL KALLSYMS SECURITY_YAMA NTFS_FS
            TCP_CONG_ADVANCED TCP_CONG_CUBIC TCP_CONG_BBR DEFAULT_CUBIC
            NET_SCH_FQ NET_SCH_DEFAULT DEFAULT_PFIFO_FAST
            NETFILTER_NETLINK CRYPTO_LZ4 MODULES QCA_CLD_WLAN
          )

          for symbol in "${symbols[@]}"; do
            if ! grep -Rqs --include='Kconfig*' -E "^[[:space:]]*(menu)?config[[:space:]]+${symbol}([[:space:]]|$)" "$ROOT"; then
              echo "::error::Build workflow requests CONFIG_${symbol}, but no matching Kconfig declaration was found."
              exit 1
            fi
          done

          grep -Fq '# CONFIG_KPM is not set' "${GITHUB_WORKSPACE}/.github/workflows/lemonadep.builtin.full.new.yml"
          echo "BUILDSYSTEM_KCONFIG_DECLARATIONS=PASS"

