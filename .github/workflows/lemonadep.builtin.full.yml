name: SukiSU Ultra builtin-new + SUSFS (Official Full Build)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      # 1. 腾出编译空间
      - name: "1. Maximize Build Space"
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048

      # 2. 签出当前仓库：workflow 和所有 patch 文件都在仓库根目录
      - name: "2. Checkout Patch Repository"
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # 3. 拉取 LineageOS 内核源码
      - name: "3. Checkout Kernel Source"
        uses: actions/checkout@v5
        with:
          repository: LineageOS/android_kernel_oneplus_sm8350
          ref: lineage-24.0
          path: kernel_source
          fetch-depth: 1

      # 3a. 读取 LineageOS 设备模块清单（vendor_dlkm / vendor_boot）
      - name: "3a. Checkout Device Module Manifests"
        uses: actions/checkout@v5
        with:
          repository: LineageOS/android_device_oneplus_sm8350-common
          ref: lineage-24.0
          path: device_common_source
          fetch-depth: 1

      # 4. 拉取官方 Clang 工具链
      - name: "4. Setup Google Clang"
        run: |
          mkdir -p toolchain/clang
          curl -L "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel/clang-r614150.tar.gz" | tar -xz -C toolchain/clang
          echo "${GITHUB_WORKSPACE}/toolchain/clang/bin" >> "$GITHUB_PATH"

      # 5. Apply the complete kernel patch and the independent binder-freezer patch.
      #    Dry-run each patch with zero fuzz before applying it.
      - name: "5. Apply kernel patches"
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/kernel_source"

          test -s "${GITHUB_WORKSPACE}/lemonadep.kernel-new.patch"
          test -s "${GITHUB_WORKSPACE}/binder-freezer-enable.patch"
          test -s "${GITHUB_WORKSPACE}/lemonadep.sukisu-new.patch"

          patch --dry-run -p1 --fuzz=0 < "${GITHUB_WORKSPACE}/lemonadep.kernel-new.patch"
          patch -p1 --fuzz=0 < "${GITHUB_WORKSPACE}/lemonadep.kernel-new.patch"

          patch --dry-run -p1 --fuzz=0 < "${GITHUB_WORKSPACE}/binder-freezer-enable.patch"
          patch -p1 --fuzz=0 < "${GITHUB_WORKSPACE}/binder-freezer-enable.patch"

      # 6. 检出 builtin-new 最新分支，并严格检查 5.4 适配补丁能否应用。
      - name: "6. Integrate SukiSU builtin-new"
        run: |
          set -euo pipefail
          KSU="${GITHUB_WORKSPACE}/kernel_source/KernelSU"

          rm -rf "$KSU"
          git clone --depth=1 --single-branch --branch builtin-new \
            https://github.com/SukiSU-Ultra/SukiSU-Ultra.git "$KSU"

          SUKISU_REF="$(git -C "$KSU" rev-parse HEAD)"
          echo "[+] SukiSU builtin-new commit: $SUKISU_REF"
          echo "SUKISU_REF=$SUKISU_REF" >> "$GITHUB_ENV"

          cd "${GITHUB_WORKSPACE}/kernel_source"
          rm -rf drivers/kernelsu
          ln -s ../KernelSU/kernel drivers/kernelsu

          grep -Fqx 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile

          # Add the KSU Kconfig entry only once, immediately before the final endmenu.
          python3 - <<'PYKCONFIG'
          from pathlib import Path

          p = Path("drivers/Kconfig")
          text = p.read_text()
          entry = 'source "drivers/kernelsu/Kconfig"'
          count = sum(line.strip() == entry for line in text.splitlines())

          if count > 1:
              raise SystemExit(f"ERROR: duplicated KSU Kconfig entries: {count}")
          if count == 0:
              pos = text.rfind("\nendmenu")
              if pos < 0:
                  raise SystemExit("ERROR: final endmenu not found in drivers/Kconfig")
              text = text[:pos] + "\n" + entry + text[pos:]
              p.write_text(text)

          if sum(line.strip() == entry for line in p.read_text().splitlines()) != 1:
              raise SystemExit("ERROR: failed to install exactly one KSU Kconfig entry")
          PYKCONFIG

          test -L drivers/kernelsu
          test "$(readlink -f drivers/kernelsu)" = "$(readlink -f "$KSU/kernel")"
          grep -Fqx 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile
          grep -Fqx 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          # The 5.4 adaptation is based on builtin-new; do not allow a fuzzy/partial apply.
          patch -d "$KSU" --dry-run -p1 --fuzz=0 < "${GITHUB_WORKSPACE}/lemonadep.sukisu-new.patch"
          patch -d "$KSU" -p1 --fuzz=0 < "${GITHUB_WORKSPACE}/lemonadep.sukisu-new.patch"

          git -C "$KSU" diff --check
          grep -Fq 'ksu_handle_faccessat_kernel' "$KSU/kernel/feature/sucompat.c"
          grep -Fq 'ksu_handle_stat_kernel' "$KSU/kernel/feature/sucompat.c"
          grep -Fq 'ksu_selinux_hide_snapshot_legacy' "$KSU/kernel/feature/selinux_hide.c"
          grep -Fq 'ksu_seccomp_allow_reboot' "$KSU/kernel/hook/setuid_hook.c"
          echo "[+] SukiSU patch applied cleanly to builtin-new: $SUKISU_REF"

      # 7. 配置 + 检查 + 编译
      - name: "7. Configure and build kernel"
        run: |
          cd kernel_source
          OUT="${GITHUB_WORKSPACE}/out"
          DEFCONFIG="arch/arm64/configs/vendor/lahaina-qgki_defconfig"

          cat << 'EOF' >> "$DEFCONFIG"

          # SukiSU / SUSFS
          CONFIG_RPS=y
          CONFIG_BOOT_CONFIG=y
          CONFIG_SECCOMP_FILTER=y
          # SUS_MOUNT: hide fanotify mount IDs in /proc/<pid>/fdinfo.
          CONFIG_FANOTIFY=y
          CONFIG_KSU=y
          CONFIG_KSU_FEATURE_ADBROOT=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_INLINE_HOOK=y
          CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_DEBUG_KERNEL=y
          CONFIG_KALLSYMS=y
          # CONFIG_KPM is not set
          CONFIG_SECURITY_YAMA=y
          CONFIG_NTFS_FS=y
          # Phase 1: ZRAM LZ4 is selected by the kernel patch.
          # Keep CUBIC as the default; BBR is available for explicit runtime selection.
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_CUBIC=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_CUBIC=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_DEFAULT=y
          CONFIG_DEFAULT_FQ=y
          # IPSET kernel support (ipset userspace binary remains separate).
          CONFIG_IP_SET=y
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_NETFILTER_XT_SET=y
          EOF

          MAKE_ARGS=(
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CC=clang
            KCFLAGS="-Wno-unused-function"
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            LOCALVERSION=-RONOVA
            O="$OUT"
          )

          make "${MAKE_ARGS[@]}" vendor/lahaina-qgki_defconfig
          make "${MAKE_ARGS[@]}" olddefconfig
          for cfg in CONFIG_RPS=y CONFIG_BOOT_CONFIG=y CONFIG_SECCOMP_FILTER=y CONFIG_FANOTIFY=y CONFIG_KSU=y CONFIG_KSU_FEATURE_ADBROOT=y CONFIG_KSU_SUSFS=y CONFIG_KSU_SUSFS_SUS_PATH=y CONFIG_KSU_SUSFS_SUS_MAP=y CONFIG_KSU_SUSFS_SUS_MOUNT=y CONFIG_KSU_SUSFS_SUS_KSTAT=y CONFIG_KSU_SUSFS_INLINE_HOOK=y CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y CONFIG_KSU_SUSFS_OPEN_REDIRECT=y CONFIG_KSU_SUSFS_SPOOF_UNAME=y CONFIG_KSU_SUSFS_ENABLE_LOG=y CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y CONFIG_DEBUG_KERNEL=y CONFIG_KALLSYMS=y CONFIG_SECURITY_YAMA=y CONFIG_NTFS_FS=y CONFIG_TCP_CONG_ADVANCED=y CONFIG_TCP_CONG_CUBIC=y CONFIG_TCP_CONG_BBR=y CONFIG_DEFAULT_CUBIC=y CONFIG_NET_SCH_FQ=y CONFIG_NET_SCH_DEFAULT=y CONFIG_DEFAULT_FQ=y CONFIG_IP_SET=y CONFIG_IP_SET_BITMAP_IP=y CONFIG_IP_SET_HASH_IP=y CONFIG_IP_SET_HASH_NET=y CONFIG_IP_SET_HASH_IPPORT=y CONFIG_IP_SET_HASH_NETPORT=y CONFIG_IP_SET_LIST_SET=y CONFIG_NETFILTER_XT_SET=y CONFIG_NETFILTER_NETLINK=y CONFIG_CRYPTO_LZ4=y CONFIG_MODULES=y CONFIG_QCA_CLD_WLAN=m; do grep -qx "$cfg" "$OUT/.config" || { echo "缺少关键配置: $cfg"; exit 1; }; done
          grep -qx 'CONFIG_DEFAULT_TCP_CONG="cubic"' "$OUT/.config" || { echo "TCP 默认拥塞算法必须保持 CUBIC"; exit 1; }
          if grep -qx 'CONFIG_KPM=y' "$OUT/.config"; then echo "KPM 必须保持禁用"; exit 1; fi

          # LineageOS 官方 kernel.mk：Image → modules → modules_install。
          make "${MAKE_ARGS[@]}" -j"$(nproc)" Image

          if grep -q '=m' "$OUT/.config"; then
            make "${MAKE_ARGS[@]}" -j"$(nproc)" modules

            MODULES_STAGE="${GITHUB_WORKSPACE}/modules_stage"
            KERNELRELEASE="$(make "${MAKE_ARGS[@]}" -s kernelrelease)"
            make "${MAKE_ARGS[@]}" INSTALL_MOD_PATH="$MODULES_STAGE" INSTALL_MOD_STRIP=1 modules_install

            MODULES_SRC="$MODULES_STAGE/lib/modules/$KERNELRELEASE"

            mapfile -t BUILT_MODULES < <(find "$OUT" -type f -name "*.ko" -printf "%f\n" | sort)
            mapfile -t INSTALLED_MODULES < <(find "$MODULES_SRC" -type f -name "*.ko" -printf "%f\n" | sort)
            if (( ${#BUILT_MODULES[@]} == 0 )); then
              echo "OUT 中没有找到 make modules 生成的 .ko 文件"
              exit 1
            fi
            if ! diff -u <(printf "%s\n" "${BUILT_MODULES[@]}") <(printf "%s\n" "${INSTALLED_MODULES[@]}"); then
              echo "编译输出与 modules_install 文件集合不一致，拒绝继续打包"
              exit 1
            fi
            echo "make modules 产物数量: ${#BUILT_MODULES[@]}"
            echo "modules_install 安装数量: ${#INSTALLED_MODULES[@]}"

            # Apply the device-tree WLAN module alias before modules_install packaging.
            mapfile -t WLAN_KOS < <(find "$MODULES_SRC" -type f -path "*/qcacld-3.0/wlan.ko")
            if [[ ${#WLAN_KOS[@]} -ne 1 ]]; then
              echo "预期找到 1 个 qcacld-3.0/wlan.ko，实际找到 ${#WLAN_KOS[@]}"
              printf "%s\n" "${WLAN_KOS[@]}"
              exit 1
            fi
            WLAN_DIR="$(dirname "${WLAN_KOS[0]}")"
            mv "${WLAN_KOS[0]}" "$WLAN_DIR/qca_cld3_wlan.ko"

            echo "MODULES_SRC=$MODULES_SRC" >> "$GITHUB_ENV"

            echo "KERNELRELEASE=$KERNELRELEASE" >> "$GITHUB_ENV"
            echo "MODULES_STAGE=$MODULES_STAGE" >> "$GITHUB_ENV"
          else
            echo "当前 .config 没有 =m 模块；与本设备预期不符。"
            exit 1
          fi

      # 8. 构建 vendor_dlkm.img，并准备 vendor_boot Recovery modules
      - name: "8. Build vendor_dlkm and Recovery modules"
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y erofs-utils kmod
          python3 - <<'PY'
          from pathlib import Path
          import os, shutil, subprocess

          ws = Path(os.environ["GITHUB_WORKSPACE"])
          src = Path(os.environ["MODULES_SRC"])
          device = ws / "device_common_source"
          names = ("modules.load", "modules.include.recovery", "modules.load.recovery")
          manifests = {n: [x.strip().split()[0] for x in (device/n).read_text().splitlines() if x.strip() and not x.lstrip().startswith("#")] for n in names}
          vendor_load, recovery_include, recovery_load = (manifests[n] for n in names)
          if not all(manifests.values()): raise RuntimeError("设备模块清单缺失或为空")

          modules = {}
          for p in sorted(src.rglob("*.ko")):
              if p.name in modules: raise RuntimeError(f"重复模块名: {p.name} ({modules[p.name]} / {p})")
              modules[p.name] = p
          if not modules: raise RuntimeError(f"modules_install 下没有 .ko: {src}")
          missing = sorted(set(vendor_load + recovery_include + recovery_load + ["qca_cld3_wlan.ko"]) - modules.keys())
          if missing: raise RuntimeError("设备清单要求的模块缺失: " + ", ".join(missing))

          work = ws / "module_image_work"
          shutil.rmtree(work, ignore_errors=True)
          work.mkdir(parents=True)

          def run_depmod(base, prefix, selected):
              metadata = base / "lib/modules/0.0"
              for name in ("modules.builtin", "modules.builtin.modinfo"):
                  source = src / name
                  if not source.is_file(): raise RuntimeError(f"modules_install 缺少 {name}: {source}")
                  shutil.copy2(source, metadata/name)
              order_source = src / "modules.order"
              if not order_source.is_file(): raise RuntimeError(f"modules_install 缺少 modules.order: {order_source}")
              ordered, seen = [], set()
              for entry in order_source.read_text().splitlines():
                  name = Path(entry.strip()).name
                  if name == "wlan.ko": name = "qca_cld3_wlan.ko"
                  if name in selected and name not in seen:
                      ordered.append(f"{prefix}/{name}")
                      seen.add(name)
              ordered.extend(f"{prefix}/{name}" for name in sorted(selected - seen))
              (metadata/"modules.order").write_text("\n".join(ordered) + "\n")
              subprocess.run(["depmod", "-b", str(base), "0.0"], check=True)
              depfile = base / "lib/modules/0.0/modules.dep"
              if not depfile.is_file(): raise RuntimeError(f"depmod 未生成 {depfile}")
              result = {}
              for line in depfile.read_text().splitlines():
                  left, sep, right = line.partition(":")
                  if not sep: raise RuntimeError(f"modules.dep 格式错误: {line}")
                  result[Path(left).name] = [Path(x).name for x in right.split()]
              return result

          def closure(roots, depmap):
              found, pending = set(), list(roots)
              while pending:
                  name = pending.pop()
                  if name in found: continue
                  if name not in depmap: raise RuntimeError(f"depmod 缺少模块或依赖: {name}")
                  found.add(name)
                  pending.extend(depmap[name])
              return found

          all_base = work / "all_modules"
          all_dir = all_base / "lib/modules/0.0/vendor/lib/modules"
          all_dir.mkdir(parents=True)
          for name, p in modules.items(): shutil.copy2(p, all_dir/name)
          all_depmap = run_depmod(all_base, "vendor/lib/modules", set(modules))
          closure(vendor_load + ["qca_cld3_wlan.ko"], all_depmap)
          recovery_allowed = set(recovery_include)
          extra = sorted(closure(recovery_load, all_depmap) - recovery_allowed)
          if extra: raise RuntimeError("Recovery 清单缺少依赖: " + ", ".join(extra))

          def rewrite_dep(text, prefix):
              rows = []
              for line in text.splitlines():
                  left, sep, right = line.partition(":")
                  if not sep or not left: raise RuntimeError(f"modules.dep 格式错误: {line}")
                  paths = ["/" + x.lstrip("/") for x in [left, *right.split()]]
                  if any(not x.startswith(prefix) for x in paths): raise RuntimeError(f"modules.dep 路径异常: {line}")
                  rows.append(paths[0] + ":" + ((" " + " ".join(paths[1:])) if len(paths) > 1 else ""))
              return "\n".join(rows) + "\n"

          def build_modules(target, selected, vendor):
              target.mkdir(parents=True, exist_ok=True)
              for name in sorted(selected): shutil.copy2(modules[name], target/name)
              if vendor:
                  metadata, prefix = all_base / "lib/modules/0.0", "/vendor/lib/modules/"
              else:
                  base = work / "depmod_recovery"
                  depdir = base / "lib/modules/0.0/lib/modules"
                  depdir.mkdir(parents=True)
                  for name in sorted(selected): shutil.copy2(modules[name], depdir/name)
                  run_depmod(base, "lib/modules", selected)
                  metadata, prefix = base / "lib/modules/0.0", "/lib/modules/"
              for name in ("modules.dep", "modules.alias", "modules.softdep"):
                  p = metadata/name
                  if not p.is_file(): raise RuntimeError(f"depmod 缺少 {name}")
                  value = p.read_text()
                  (target/name).write_text(rewrite_dep(value, prefix) if name == "modules.dep" else value)

          vendor_root = ws / "vendor_dlkm_root"
          shutil.rmtree(vendor_root, ignore_errors=True)
          vendor_modules = vendor_root / "lib/modules"
          build_modules(vendor_modules, set(modules), True)
          (vendor_modules/"modules.load").write_text("\n".join(vendor_load) + "\n")
          shutil.copy2(device/"modules.blocklist", vendor_modules/"modules.blocklist")

          ramdisk_root = ws / "vendor_ramdisk"
          shutil.rmtree(ramdisk_root, ignore_errors=True)
          recovery_modules = ramdisk_root / "ramdisk/lib/modules"
          build_modules(recovery_modules, recovery_allowed, False)
          (recovery_modules/"modules.load.recovery").write_text("\n".join(recovery_load) + "\n")
          print(f"vendor_dlkm: {len(modules)} modules; Recovery ramdisk: {len(recovery_allowed)} modules")
          PY
          printf '%s\n' '/(vendor_dlkm|vendor/vendor_dlkm|system/vendor/vendor_dlkm)(/.*)? u:object_r:vendor_file:s0' > "$GITHUB_WORKSPACE/vendor_dlkm_file_contexts"
          find "$GITHUB_WORKSPACE/vendor_dlkm_root" -type d -exec chmod 0755 {} + && find "$GITHUB_WORKSPACE/vendor_dlkm_root" -type f -exec chmod 0644 {} +
          mkfs.erofs -z lz4 -b 4096 -T 0 --mount-point=/vendor_dlkm --file-contexts="$GITHUB_WORKSPACE/vendor_dlkm_file_contexts" --force-uid=0 --force-gid=0 "$GITHUB_WORKSPACE/vendor_dlkm.img" "$GITHUB_WORKSPACE/vendor_dlkm_root"
          fsck.erofs "$GITHUB_WORKSPACE/vendor_dlkm.img"

      # 9. AnyKernel3：boot + vendor_boot(v3) + vendor_dlkm
      - name: "9. Pack blu_spark-style AnyKernel3 ZIP"
        run: |
          set -euo pipefail
          git clone https://github.com/huaiding230-code/AnyKernel3.git AnyKernel3 && git -C AnyKernel3 checkout --detach 911e62eea1f2a020a6785940e217ff025bca3bc2
          cp "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" AnyKernel3/Image && cp "$GITHUB_WORKSPACE/vendor_dlkm.img" AnyKernel3/vendor_dlkm.img && mkdir -p AnyKernel3/vendor_ramdisk && cp -a "$GITHUB_WORKSPACE/vendor_ramdisk/ramdisk" AnyKernel3/vendor_ramdisk/
          python3 -c 'from pathlib import Path; p=Path("AnyKernel3/anykernel.sh"); s=p.read_text().replace("kernel.string=blu_spark Kernel with SukiSU Ultra + SUSFS for OnePlus 9 Series","kernel.string=SukiSU Ultra builtin-new + SUSFS for OnePlus 9 Pro"); old="dump_boot;\n\nwrite_boot;\n## end boot install"; new="dump_boot;\n\nwrite_boot;\n\n# Update vendor_boot v3 Recovery ramdisk without replacing its original contents.\nBLOCK=/dev/block/bootdevice/by-name/vendor_boot;\nRAMDISK_COMPRESSION=auto;\nreset_ak;\ndump_boot;\nwrite_boot;\n## end boot install"; assert old in s, "AnyKernel3 boot install 区块不匹配"; p.write_text(s.replace(old,new,1))'
          cd AnyKernel3
          ZIP="$GITHUB_WORKSPACE/SukiSU-SUSFS-Kernel-OP9P.zip"
          zip -r9 "$ZIP" * -x README.md '*placeholder'
          unzip -tqq "$ZIP"

      # 10. 上传完整刷机包
      - name: "10. Upload Build Artifact"
        uses: actions/upload-artifact@v7
        with:
          name: SukiSU-SUSFS-Full-Build
          path: SukiSU-SUSFS-Kernel-OP9P.zip
          archive: false
