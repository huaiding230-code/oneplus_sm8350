name: SukiSU Ultra builtin-new + SUSFS (Official Full Build)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      # 1. 腾出编译空间
      - name: "1. Maximize Build Space"
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048

      # 2. 签出当前仓库：workflow 和所有 patch 文件都在仓库根目录
      - name: "2. Checkout Patch Repository"
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # 3. 拉取 LineageOS 内核源码
      - name: "3. Checkout Kernel Source"
        uses: actions/checkout@v5
        with:
          repository: LineageOS/android_kernel_oneplus_sm8350
          ref: lineage-24.0
          path: kernel_source
          fetch-depth: 1

      # 3a. 读取 LineageOS 设备模块清单（vendor_dlkm / vendor_boot）
      - name: "3a. Checkout Device Module Manifests"
        uses: actions/checkout@v5
        with:
          repository: LineageOS/android_device_oneplus_sm8350-common
          ref: lineage-24.0
          path: device_common_source
          fetch-depth: 1

      # 4. 拉取官方 Clang 工具链
      - name: "4. Setup Google Clang"
        run: |
          mkdir -p toolchain/clang
          curl -L "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel/clang-r614150.tar.gz" | tar -xz -C toolchain/clang
          echo "${GITHUB_WORKSPACE}/toolchain/clang/bin" >> "$GITHUB_PATH"

      # 5. 内核侧补丁（SUSFS + Hook + SELinuxFS + seccomp 例外 + binder freezer）。
      #    必须先于 SukiSU 接入，因为会改 drivers/Makefile。
      - name: "5. Apply kernel patches"
        run: |
          cd kernel_source
          patch -p1 --fuzz=0 < "${GITHUB_WORKSPACE}/lemonadep.kernel-new.patch"
          patch -p1 --fuzz=0 < "${GITHUB_WORKSPACE}/binder-freezer-enable.patch"

      # 6. 接入固定版本的 SukiSU builtin-new，并应用 5.4 适配补丁
      - name: "6. Integrate SukiSU"
        run: |
          KSU="${GITHUB_WORKSPACE}/kernel_source/KernelSU"

          git init "$KSU"
          git -C "$KSU" fetch --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git 0804a40956b4345fa5ce392170a907e174d402f0
          git -C "$KSU" checkout --detach FETCH_HEAD

          cd "${GITHUB_WORKSPACE}/kernel_source"
          ln -s ../KernelSU/kernel drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          patch -d "$KSU" -p1 --fuzz=0 < "${GITHUB_WORKSPACE}/lemonadep.sukisu-new.patch"

      # 7. 配置 + 检查 + 编译
      - name: "7. Configure and build kernel"
        run: |
          cd kernel_source
          OUT="${GITHUB_WORKSPACE}/out"
          DEFCONFIG="arch/arm64/configs/vendor/lahaina-qgki_defconfig"

          cat << 'EOF' >> "$DEFCONFIG"

          # SukiSU / SUSFS
          CONFIG_RPS=y
          CONFIG_BOOT_CONFIG=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_KSU=y
          CONFIG_KSU_FEATURE_ADBROOT=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_INLINE_HOOK=y
          CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_DEBUG_KERNEL=y
          CONFIG_KALLSYMS=y
          # KPM 不启用
          # CONFIG_KPM is not set
          CONFIG_SECURITY_YAMA=y
          CONFIG_NTFS_FS=y
          EOF

          MAKE_ARGS=(
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CC=clang
            KCFLAGS="-Wno-unused-function"
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            LOCALVERSION=-RONOVA
            O="$OUT"
          )

          make "${MAKE_ARGS[@]}" vendor/lahaina-qgki_defconfig
          make "${MAKE_ARGS[@]}" olddefconfig
          for cfg in CONFIG_KSU=y CONFIG_KSU_FEATURE_ADBROOT=y CONFIG_KSU_SUSFS=y CONFIG_KSU_SUSFS_SUS_PATH=y CONFIG_KSU_SUSFS_SUS_MAP=y CONFIG_KSU_SUSFS_SUS_MOUNT=y CONFIG_KSU_SUSFS_SUS_KSTAT=y CONFIG_KSU_SUSFS_INLINE_HOOK=y CONFIG_KSU_SUSFS_OPEN_REDIRECT=y CONFIG_MODULES=y CONFIG_QCA_CLD_WLAN=m; do grep -qx "$cfg" "$OUT/.config" || { echo "缺少关键配置: $cfg"; exit 1; }; done
          if grep -qx 'CONFIG_KPM=y' "$OUT/.config"; then echo "KPM 必须保持禁用"; exit 1; fi

          # LineageOS 官方 kernel.mk：Image → modules → modules_install。
          make "${MAKE_ARGS[@]}" -j"$(nproc)" Image

          if grep -q '=m' "$OUT/.config"; then
            make "${MAKE_ARGS[@]}" -j"$(nproc)" modules

            MODULES_STAGE="${GITHUB_WORKSPACE}/modules_stage"
            KERNELRELEASE="$(make "${MAKE_ARGS[@]}" -s kernelrelease)"
            make "${MAKE_ARGS[@]}" \
              INSTALL_MOD_PATH="$MODULES_STAGE" \
              INSTALL_MOD_STRIP=1 \
              modules_install

            MODULES_SRC="$MODULES_STAGE/lib/modules/$KERNELRELEASE"

            mapfile -t BUILT_MODULES < <(find "$OUT" -type f -name "*.ko" -printf "%f\n" | sort)
            mapfile -t INSTALLED_MODULES < <(find "$MODULES_SRC" -type f -name "*.ko" -printf "%f\n" | sort)
            if (( ${#BUILT_MODULES[@]} == 0 )); then
              echo "OUT 中没有找到 make modules 生成的 .ko 文件"
              exit 1
            fi
            if ! diff -u <(printf "%s\n" "${BUILT_MODULES[@]}") <(printf "%s\n" "${INSTALLED_MODULES[@]}"); then
              echo "编译输出与 modules_install 文件集合不一致，拒绝继续打包"
              exit 1
            fi
            echo "make modules 产物数量: ${#BUILT_MODULES[@]}"
            echo "modules_install 安装数量: ${#INSTALLED_MODULES[@]}"

            test -s "$MODULES_SRC/kernel/techpack/display/msm/msm_drm.ko" || {
              echo "完整模块安装结果缺少 msm_drm.ko"
              exit 1
            }

            # Apply the device-tree WLAN module alias before modules_install packaging.
            mapfile -t WLAN_KOS < <(find "$MODULES_SRC" -type f -path "*/qcacld-3.0/wlan.ko")
            if [[ ${#WLAN_KOS[@]} -ne 1 ]]; then
              echo "预期找到 1 个 qcacld-3.0/wlan.ko，实际找到 ${#WLAN_KOS[@]}"
              printf "%s\n" "${WLAN_KOS[@]}"
              exit 1
            fi
            WLAN_DIR="$(dirname "${WLAN_KOS[0]}")"
            mv "${WLAN_KOS[0]}" "$WLAN_DIR/qca_cld3_wlan.ko"

            test -s "$WLAN_DIR/qca_cld3_wlan.ko"
            echo "MODULES_SRC=$MODULES_SRC" >> "$GITHUB_ENV"

            echo "KERNELRELEASE=$KERNELRELEASE" >> "$GITHUB_ENV"
            echo "MODULES_STAGE=$MODULES_STAGE" >> "$GITHUB_ENV"
          else
            echo "当前 .config 没有 =m 模块；与本设备预期不符。"
            exit 1
          fi

      # 8. 构建 vendor_dlkm.img，并准备 vendor_boot Recovery modules
      - name: "8. Build vendor_dlkm and Recovery modules"
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y erofs-utils kmod
          python3 "${GITHUB_WORKSPACE}/scripts/build_vendor_dlkm.py"
          printf '%s\\n' '/(vendor_dlkm|vendor/vendor_dlkm|system/vendor/vendor_dlkm)(/.*)? u:object_r:vendor_file:s0' > "$GITHUB_WORKSPACE/vendor_dlkm_file_contexts"
          find "$GITHUB_WORKSPACE/vendor_dlkm_root" -type d -exec chmod 0755 {} + && find "$GITHUB_WORKSPACE/vendor_dlkm_root" -type f -exec chmod 0644 {} +
          mkfs.erofs -z lz4 -b 4096 -T 0 --mount-point=/vendor_dlkm --file-contexts="$GITHUB_WORKSPACE/vendor_dlkm_file_contexts" --force-uid=0 --force-gid=0 "$GITHUB_WORKSPACE/vendor_dlkm.img" "$GITHUB_WORKSPACE/vendor_dlkm_root"
          fsck.erofs "$GITHUB_WORKSPACE/vendor_dlkm.img"
          test -s "$GITHUB_WORKSPACE/vendor_dlkm.img" && test -s "$GITHUB_WORKSPACE/vendor_ramdisk/ramdisk/lib/modules/modules.load.recovery"
          grep -q "qca_cld3_wlan.ko:" "$GITHUB_WORKSPACE/vendor_dlkm_root/lib/modules/modules.dep"

      # 9. AnyKernel3：boot + vendor_boot(v3) + vendor_dlkm
      - name: "9. Pack blu_spark-style AnyKernel3 ZIP"
        run: |
          set -euo pipefail
          git clone https://github.com/huaiding230-code/AnyKernel3.git AnyKernel3 && git -C AnyKernel3 checkout --detach 5046aab827c2b9837abcd2a56cf81752341315c7
          cp "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" AnyKernel3/Image && cp "$GITHUB_WORKSPACE/vendor_dlkm.img" AnyKernel3/vendor_dlkm.img && mkdir -p AnyKernel3/vendor_ramdisk && cp -a "$GITHUB_WORKSPACE/vendor_ramdisk/ramdisk" AnyKernel3/vendor_ramdisk/
          rm -f AnyKernel3/modules/system/lib/modules/placeholder AnyKernel3/patch/placeholder AnyKernel3/ramdisk/placeholder
          python3 -c 'from pathlib import Path; p=Path("AnyKernel3/anykernel.sh"); s=p.read_text().replace("kernel.string=blu_spark Kernel with SukiSU Ultra + SUSFS for OnePlus 9 Series","kernel.string=SukiSU Ultra builtin-new + SUSFS for OnePlus 9 Pro"); old="dump_boot;\n\nwrite_boot;\n## end boot install"; new="dump_boot;\n\nwrite_boot;\n\n# Update vendor_boot v3 Recovery ramdisk without replacing its original contents.\nBLOCK=/dev/block/bootdevice/by-name/vendor_boot;\nRAMDISK_COMPRESSION=auto;\nreset_ak;\ndump_boot;\nwrite_boot;\n## end boot install"; assert old in s, "AnyKernel3 boot install 区块不匹配"; p.write_text(s.replace(old,new,1))'
          cd AnyKernel3
          ZIP="$GITHUB_WORKSPACE/SukiSU-SUSFS-Kernel-OP9P.zip"
          zip -r9 "$ZIP" * -x README.md
          unzip -tqq "$ZIP"
          ZIP_CONTENTS="$(unzip -Z1 "$ZIP")"
          for entry in Image vendor_dlkm.img anykernel.sh vendor_ramdisk/ramdisk/lib/modules/modules.load.recovery vendor_ramdisk/ramdisk/lib/modules/adsp_loader_dlkm.ko vendor_ramdisk/ramdisk/lib/modules/apr_dlkm.ko vendor_ramdisk/ramdisk/lib/modules/msm_drm.ko vendor_ramdisk/ramdisk/lib/modules/q6_notifier_dlkm.ko vendor_ramdisk/ramdisk/lib/modules/q6_pdr_dlkm.ko vendor_ramdisk/ramdisk/lib/modules/snd_event_dlkm.ko; do grep -Fxq "$entry" <<< "$ZIP_CONTENTS" || { echo "刷机包缺少: $entry"; exit 1; }; done
          grep -q "BLOCK=/dev/block/bootdevice/by-name/vendor_boot" anykernel.sh && grep -q "flash_generic vendor_dlkm" tools/ak3-core.sh || { echo "AK3 缺少 vendor_boot/vendor_dlkm 刷写逻辑"; exit 1; }

      # 10. 上传完整刷机包
      - name: "10. Upload Build Artifact"
        uses: actions/upload-artifact@v7
        with:
          name: SukiSU-SUSFS-Full-Build
          path: SukiSU-SUSFS-Kernel-OP9P.zip
          archive: false
