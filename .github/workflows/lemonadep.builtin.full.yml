name: SukiSU Ultra builtin-new + SUSFS (Official Full Build)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      # 1. 腾出编译空间
      - name: "1. Maximize Build Space"
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048

      # 2. 签出当前仓库：workflow 和所有 patch 文件都在仓库根目录
      - name: "2. Checkout Patch Repository"
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # 3. 拉取 LineageOS 内核源码
      - name: "3. Checkout Kernel Source"
        uses: actions/checkout@v5
        with:
          repository: LineageOS/android_kernel_oneplus_sm8350
          ref: lineage-24.0
          path: kernel_source
          fetch-depth: 1

      # 3a. 读取 LineageOS 设备模块清单（vendor_dlkm / vendor_boot）
      - name: "3a. Checkout Device Module Manifests"
        uses: actions/checkout@v5
        with:
          repository: LineageOS/android_device_oneplus_sm8350-common
          ref: lineage-24.0
          path: device_common_source
          fetch-depth: 1

      # 4. 拉取官方 Clang 工具链
      - name: "4. Setup Google Clang"
        run: |
          set -euo pipefail
          mkdir -p toolchain/clang
          CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel/clang-r614150.tar.gz"
          CLANG_ARCHIVE="${RUNNER_TEMP}/clang-r614150.tar.gz"

          # Google Gitiles can occasionally return a short error page instead of the archive.
          # Download to a file, check HTTP status and gzip integrity, then retry before extraction.
          downloaded=0
          for attempt in 1 2 3 4 5; do
            rm -f "$CLANG_ARCHIVE"
            if curl --fail --location --silent --show-error \
                --connect-timeout 30 --max-time 900 \
                --output "$CLANG_ARCHIVE" \
                --write-out "HTTP %{http_code}; content-type %{content_type}; bytes %{size_download}\n" \
                "$CLANG_URL"; then
              if gzip -t "$CLANG_ARCHIVE" 2>/dev/null; then
                downloaded=1
                break
              fi
              echo "Clang archive is not a valid gzip file (attempt $attempt/5)."
              echo "Response preview:"
              head -c 512 "$CLANG_ARCHIVE" | tr -cd '[:print:]\n\r\t' | head -c 512 || true
              echo
            else
              echo "Clang download failed (attempt $attempt/5)."
            fi
            if (( attempt < 5 )); then
              sleep "$((attempt * 5))"
            fi
          done

          if (( downloaded != 1 )); then
            echo "::error::Unable to download a valid clang-r614150 archive after 5 attempts."
            exit 1
          fi

          tar -xzf "$CLANG_ARCHIVE" -C toolchain/clang
          test -x toolchain/clang/bin/clang
          toolchain/clang/bin/clang --version | head -n 1
          echo "${GITHUB_WORKSPACE}/toolchain/clang/bin" >> "$GITHUB_PATH"

      # 5. 内核侧补丁（SUSFS + Hook + SELinuxFS + seccomp 例外 + binder freezer）。
      #    必须先于 SukiSU 接入，因为会改 drivers/Makefile。
      - name: "5. Apply kernel patches"
        run: |
          cd kernel_source
          patch -p1 --fuzz=0 < "${GITHUB_WORKSPACE}/lemonadep.kernel-new.patch"
          patch -p1 --fuzz=0 < "${GITHUB_WORKSPACE}/binder-freezer-enable.patch"

      # 6. 接入固定版本的 SukiSU builtin-new，并应用 5.4 适配补丁
      - name: "6. Integrate SukiSU"
        run: |
          KSU="${GITHUB_WORKSPACE}/kernel_source/KernelSU"

          git init "$KSU"
          git -C "$KSU" fetch --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git 0804a40956b4345fa5ce392170a907e174d402f0
          git -C "$KSU" checkout --detach FETCH_HEAD

          cd "${GITHUB_WORKSPACE}/kernel_source"
          ln -s ../KernelSU/kernel drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          patch -d "$KSU" -p1 --fuzz=0 < "${GITHUB_WORKSPACE}/lemonadep.sukisu-new.patch"

      # 7. 配置 + 检查 + 编译
      - name: "7. Configure and build kernel"
        run: |
          cd kernel_source
          OUT="${GITHUB_WORKSPACE}/out"
          DEFCONFIG="arch/arm64/configs/vendor/lahaina-qgki_defconfig"

          cat << 'EOF' >> "$DEFCONFIG"

          # SukiSU / SUSFS
          CONFIG_RPS=y
          CONFIG_BOOT_CONFIG=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_KSU=y
          CONFIG_KSU_FEATURE_ADBROOT=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_INLINE_HOOK=y
          CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_DEBUG_KERNEL=y
          CONFIG_KALLSYMS=y
          # KPM 不启用
          # CONFIG_KPM is not set
          CONFIG_SECURITY_YAMA=y
          CONFIG_NTFS_FS=y
          EOF

          MAKE_ARGS=(
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CC=clang
            KCFLAGS="-Wno-unused-function"
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            LOCALVERSION=-RONOVA
            O="$OUT"
          )

          make "${MAKE_ARGS[@]}" vendor/lahaina-qgki_defconfig
          make "${MAKE_ARGS[@]}" olddefconfig
          grep -qx "CONFIG_QCA_CLD_WLAN=m" "$OUT/.config" || {
            echo "设备需要的 QCA CLD WLAN 模块未启用（CONFIG_QCA_CLD_WLAN=m）"
            exit 1
          }

          # olddefconfig 会悄悄丢掉未定义的选项，编译前确认关键项还在，避免白编译一遍
          for cfg in CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_KSU_SUSFS_SUS_PATH \
                     CONFIG_KSU_SUSFS_SUS_MAP CONFIG_KSU_SUSFS_SUS_MOUNT \
                     CONFIG_KSU_SUSFS_SUS_KSTAT CONFIG_KSU_SUSFS_INLINE_HOOK \
                     CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER CONFIG_KSU_SUSFS_OPEN_REDIRECT \
                     CONFIG_KSU_SUSFS_SPOOF_UNAME CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
                     CONFIG_KSU_SUSFS_ENABLE_LOG CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                     CONFIG_NET CONFIG_SECCOMP CONFIG_SECCOMP_FILTER \
                     CONFIG_NTFS_FS CONFIG_SECURITY_YAMA \
                     CONFIG_SECURITY CONFIG_SECURITY_SELINUX CONFIG_SECURITYFS \
                     CONFIG_KALLSYMS CONFIG_KALLSYMS_ALL \
                     CONFIG_MODULES CONFIG_MODVERSIONS CONFIG_JUMP_LABEL; do
            grep -qx "${cfg}=y" "$OUT/.config" || { echo "缺少配置: ${cfg}=y"; exit 1; }
          done

          # LineageOS 官方 kernel.mk：Image → modules → modules_install。
          make "${MAKE_ARGS[@]}" -j"$(nproc)" Image

          if grep -q '=m' "$OUT/.config"; then
            make "${MAKE_ARGS[@]}" -j"$(nproc)" modules

            MODULES_STAGE="${GITHUB_WORKSPACE}/modules_stage"
            KERNELRELEASE="$(make "${MAKE_ARGS[@]}" -s kernelrelease)"
            make "${MAKE_ARGS[@]}" \
              INSTALL_MOD_PATH="$MODULES_STAGE" \
              INSTALL_MOD_STRIP=1 \
              modules_install

            MODULES_SRC="$MODULES_STAGE/lib/modules/$KERNELRELEASE"

            mapfile -t BUILT_MODULES < <(find "$OUT" -type f -name "*.ko" -printf "%f\n" | sort)
            mapfile -t INSTALLED_MODULES < <(find "$MODULES_SRC" -type f -name "*.ko" -printf "%f\n" | sort)
            if (( ${#BUILT_MODULES[@]} == 0 )); then
              echo "OUT 中没有找到 make modules 生成的 .ko 文件"
              exit 1
            fi
            if ! diff -u <(printf "%s\n" "${BUILT_MODULES[@]}") <(printf "%s\n" "${INSTALLED_MODULES[@]}"); then
              echo "编译输出与 modules_install 文件集合不一致，拒绝继续打包"
              exit 1
            fi
            echo "make modules 产物数量: ${#BUILT_MODULES[@]}"
            echo "modules_install 安装数量: ${#INSTALLED_MODULES[@]}"

            test -s "$MODULES_SRC/kernel/techpack/display/msm/msm_drm.ko" || {
              echo "完整模块安装结果缺少 msm_drm.ko"
              exit 1
            }

            # Apply the device-tree WLAN module alias before modules_install packaging.
            mapfile -t WLAN_KOS < <(find "$MODULES_SRC" -type f -path "*/qcacld-3.0/wlan.ko")
            if [[ ${#WLAN_KOS[@]} -ne 1 ]]; then
              echo "预期找到 1 个 qcacld-3.0/wlan.ko，实际找到 ${#WLAN_KOS[@]}"
              printf "%s\n" "${WLAN_KOS[@]}"
              exit 1
            fi
            WLAN_DIR="$(dirname "${WLAN_KOS[0]}")"
            mv "${WLAN_KOS[0]}" "$WLAN_DIR/qca_cld3_wlan.ko"

            test -s "$WLAN_DIR/qca_cld3_wlan.ko"
            echo "MODULES_SRC=$MODULES_SRC" >> "$GITHUB_ENV"

            echo "KERNELRELEASE=$KERNELRELEASE" >> "$GITHUB_ENV"
            echo "MODULES_STAGE=$MODULES_STAGE" >> "$GITHUB_ENV"
          else
            echo "当前 .config 没有 =m 模块；与本设备预期不符。"
            exit 1
          fi

      # 8. 构建 vendor_dlkm.img，并准备 vendor_boot Recovery modules
      - name: "8. Build vendor_dlkm and Recovery modules"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y erofs-utils kmod

          test -d "$MODULES_SRC/kernel" || {
            echo "找不到 modules_install 内核模块目录: $MODULES_SRC/kernel"
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import shutil
          import subprocess
          import sys

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          modules_src = Path(os.environ["MODULES_SRC"])
          device = workspace / "device_common_source"
          kernelrelease = os.environ["KERNELRELEASE"]

          def read_list(filename):
              path = device / filename
              if not path.is_file():
                  raise RuntimeError(f"缺少设备模块清单: {path}")
              return [
                  line.strip().split()[0]
                  for line in path.read_text().splitlines()
                  if line.strip() and not line.lstrip().startswith("#")
              ]

          vendor_load = read_list("modules.load")
          recovery_include = read_list("modules.include.recovery")
          recovery_load = read_list("modules.load.recovery")

          if not vendor_load or not recovery_include or not recovery_load:
              raise RuntimeError("modules.load / modules.include.recovery / modules.load.recovery 不能是空文件")

          module_map = {}
          for src in sorted(modules_src.rglob("*.ko")):
              if not src.is_file():
                  continue
              if src.name in module_map:
                  raise RuntimeError(
                      f"发现同名内核模块，无法按 LineageOS vendor_dlkm 布局扁平安装: "
                      f"{src.name}\n{module_map[src.name]}\n{src}"
                  )
              module_map[src.name] = src

          if not module_map:
              raise RuntimeError(f"modules_install 下没有找到任何 .ko: {modules_src}")

          missing = sorted(set(vendor_load + recovery_include + recovery_load) - set(module_map))
          if missing:
              raise RuntimeError("设备树要求的模块没有编译出来:\n  " + "\n  ".join(missing))

          work = workspace / "module_image_work"
          if work.exists():
              shutil.rmtree(work)
          work.mkdir(parents=True)

          def run_depmod(base):
              result = subprocess.run(
                  ["depmod", "-b", str(base), "0.0"],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              if result.stdout:
                  print(result.stdout)
              if result.returncode != 0:
                  raise RuntimeError(f"depmod 失败: {base}")

          def read_depmap(base):
              depfile = base / "lib/modules/0.0/modules.dep"
              if not depfile.is_file():
                  raise RuntimeError(f"depmod 没有生成 modules.dep: {depfile}")
              depmap = {}
              for line in depfile.read_text().splitlines():
                  if ":" not in line:
                      continue
                  left, right = line.split(":", 1)
                  name = Path(left).name
                  depmap[name] = [Path(item).name for item in right.split()]
              return depmap

          def dependency_closure(roots, depmap):
              result = set()
              pending = list(roots)
              while pending:
                  name = pending.pop()
                  if name in result:
                      continue
                  if name not in depmap:
                      raise RuntimeError(f"depmod 结果里缺少模块依赖记录: {name}")
                  result.add(name)
                  pending.extend(depmap[name])
              return result

          # 先对本次 modules_install 的完整模块集运行 depmod，以解析设备清单的依赖闭包。
          all_base = work / "all_modules"
          all_moddir = all_base / "lib/modules/0.0/vendor/lib/modules"
          all_moddir.mkdir(parents=True)
          for name, src in module_map.items():
              shutil.copy2(src, all_moddir / name)
          run_depmod(all_base)
          all_depmap = read_depmap(all_base)

          # init.target.rc explicitly loads qca_cld3_wlan.ko; it is not listed in modules.load.
          explicit_vendor_load = ["qca_cld3_wlan.ko"]
          loaded_closure = dependency_closure(vendor_load + explicit_vendor_load, all_depmap)
          missing_dependencies = sorted(loaded_closure - set(module_map))
          if missing_dependencies:
              raise RuntimeError("vendor 模块依赖缺失: " + ", ".join(missing_dependencies))
          # vendor_modprobe scans /vendor/lib/modules and applies modules.blocklist.
          # Install every module built by this kernel, not only modules.load roots.
          vendor_needed = set(module_map)
          recovery_needed = dependency_closure(recovery_load, all_depmap)
          recovery_allowed = set(recovery_include)
          extra_recovery_deps = sorted(recovery_needed - recovery_allowed)
          if extra_recovery_deps:
              raise RuntimeError(
                  "modules.include.recovery 没有覆盖 modules.load.recovery 的依赖: "
                  + ", ".join(extra_recovery_deps)
              )

          def build_partition_modules(target_dir, modules, mount_prefix):
              target_dir.mkdir(parents=True, exist_ok=True)
              for name in sorted(modules):
                  shutil.copy2(module_map[name], target_dir / name)

              # 复刻 LineageOS android_build 的 depmod 布局：
              # vendor_dlkm 元数据引用 /vendor/lib/modules，Recovery ramdisk 引用 /lib/modules。
              depbase = work / ("depmod_" + ("vendor" if mount_prefix else "recovery"))
              if depbase.exists():
                  shutil.rmtree(depbase)
              if mount_prefix:
                  depmod_moddir = depbase / "lib/modules/0.0/vendor/lib/modules"
              else:
                  depmod_moddir = depbase / "lib/modules/0.0/lib/modules"
              depmod_moddir.mkdir(parents=True)
              for name in sorted(modules):
                  shutil.copy2(module_map[name], depmod_moddir / name)

              run_depmod(depbase)
              metadata_dir = depbase / "lib/modules/0.0"
              for metadata in ("modules.dep", "modules.alias", "modules.softdep"):
                  src = metadata_dir / metadata
                  if not src.is_file():
                      raise RuntimeError(f"depmod 没有生成 {metadata}: {src}")
                  text = src.read_text()
                  text = re.sub(
                      r"([^: ]*lib/modules/[^: ]*)",
                      lambda match: "/" + match.group(1).lstrip("/"),
                      text,
                  )
                  (target_dir / metadata).write_text(text)

          # vendor_dlkm：安装本次编译的全部模块；modules.load 控制加载顺序，modules.blocklist 控制禁止加载项。
          vendor_root = workspace / "vendor_dlkm_root"
          if vendor_root.exists():
              shutil.rmtree(vendor_root)
          vendor_modules = vendor_root / "lib/modules"
          build_partition_modules(vendor_modules, vendor_needed, "vendor")
          packaged_vendor_modules = {p.name for p in vendor_modules.glob("*.ko")}
          if packaged_vendor_modules != set(module_map):
              missing_packaged = sorted(set(module_map) - packaged_vendor_modules)
              unexpected_packaged = sorted(packaged_vendor_modules - set(module_map))
              raise RuntimeError(
                  f"vendor_dlkm 文件集合与 modules_install 不一致; 缺少={missing_packaged}; 多出={unexpected_packaged}"
              )
          (vendor_modules / "modules.load").write_text("\n".join(vendor_load) + "\n")
          shutil.copy2(device / "modules.blocklist", vendor_modules / "modules.blocklist")

          # vendor_boot v3：6 个 include 模块都放进 ramdisk；Recovery 实际加载清单仍只用 2 项。
          ramdisk_modules = workspace / "vendor_ramdisk/ramdisk/lib/modules"
          if ramdisk_modules.parent.parent.parent.exists():
              shutil.rmtree(workspace / "vendor_ramdisk")
          build_partition_modules(ramdisk_modules, recovery_allowed, "")
          # Match AOSP BoardConfigCommon.mk:
          # BOOT_KERNEL_MODULES packages modules.include.recovery; the Recovery
          # load-list is emitted as modules.load.recovery (not modules.load).
          (ramdisk_modules / "modules.load.recovery").write_text("\n".join(recovery_load) + "\n")

          print(f"Kernel release: {kernelrelease}")
          print(f"全部编译模块: {len(module_map)}")
          print(f"vendor_dlkm 安装模块（含依赖）: {len(vendor_needed)}")
          print(f"Recovery ramdisk 包含模块: {len(recovery_allowed)}")
          print(f"Recovery 实际加载模块: {len(recovery_load)}")
          PY

          # Android 设备树将 vendor_dlkm 标记为 EROFS，SELinux 标签沿用 AOSP file_contexts。
          cat > "$GITHUB_WORKSPACE/vendor_dlkm_file_contexts" <<'EOF'
          /(vendor_dlkm|vendor/vendor_dlkm|system/vendor/vendor_dlkm)(/.*)? u:object_r:vendor_file:s0
          EOF

          find "$GITHUB_WORKSPACE/vendor_dlkm_root" -type d -exec chmod 0755 {} +
          find "$GITHUB_WORKSPACE/vendor_dlkm_root" -type f -exec chmod 0644 {} +

          mkfs.erofs \
            -z lz4 \
            -b 4096 \
            -T 0 \
            --mount-point=/vendor_dlkm \
            --file-contexts="$GITHUB_WORKSPACE/vendor_dlkm_file_contexts" \
            --force-uid=0 \
            --force-gid=0 \
            "$GITHUB_WORKSPACE/vendor_dlkm.img" \
            "$GITHUB_WORKSPACE/vendor_dlkm_root"

          fsck.erofs "$GITHUB_WORKSPACE/vendor_dlkm.img"
          test -s "$GITHUB_WORKSPACE/vendor_dlkm.img"
          # vendor_dlkm is a logical partition inside super; do not mistake the
          # 192 MiB boot/vendor_boot fixed partition size for vendor_dlkm capacity.
          test -s "$GITHUB_WORKSPACE/vendor_ramdisk/ramdisk/lib/modules/modules.load.recovery"
          grep -q "qca_cld3_wlan.ko:" "$GITHUB_WORKSPACE/vendor_dlkm_root/lib/modules/modules.dep"

          echo "vendor_dlkm.img 大小:"
          du -h "$GITHUB_WORKSPACE/vendor_dlkm.img"
          echo "Recovery ramdisk 模块:"
          find "$GITHUB_WORKSPACE/vendor_ramdisk/ramdisk/lib/modules" -maxdepth 1 -type f -printf '%f\n' | sort

      # 9. AnyKernel3：boot + vendor_boot(v3) + vendor_dlkm
      - name: "9. Pack blu_spark-style AnyKernel3 ZIP"
        run: |
          set -euo pipefail
          git clone https://github.com/huaiding230-code/AnyKernel3.git AnyKernel3
          git -C AnyKernel3 checkout --detach 5046aab827c2b9837abcd2a56cf81752341315c7

          cp "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" AnyKernel3/Image
          cp "$GITHUB_WORKSPACE/vendor_dlkm.img" AnyKernel3/vendor_dlkm.img
          mkdir -p AnyKernel3/vendor_ramdisk
          cp -a "$GITHUB_WORKSPACE/vendor_ramdisk/ramdisk" AnyKernel3/vendor_ramdisk/

          # AnyKernel3 write_boot 已内置 flash_generic vendor_dlkm；
          # 这里额外切换到 vendor_boot，将 Recovery 模块合并进原有 vendor ramdisk。
          python3 - <<'PY'
          from pathlib import Path

          script = Path("AnyKernel3/anykernel.sh")
          content = script.read_text()

          content = content.replace(
              "kernel.string=blu_spark Kernel with SukiSU Ultra + SUSFS for OnePlus 9 Series",
              "kernel.string=SukiSU Ultra builtin-new + SUSFS for OnePlus 9 Pro",
          )

          marker = "dump_boot;\n\nwrite_boot;\n## end boot install"
          replacement = """dump_boot;

          write_boot;

          # Update vendor_boot v3 Recovery ramdisk without replacing its original contents.
          BLOCK=/dev/block/bootdevice/by-name/vendor_boot;
          RAMDISK_COMPRESSION=auto;
          reset_ak;
          dump_boot;
          write_boot;
          ## end boot install"""

          if marker not in content:
              raise SystemExit("AnyKernel3 anykernel.sh 中找不到预期的 boot install 区块，拒绝打包")
          content = content.replace(marker, replacement, 1)
          script.write_text(content)
          PY

          cd AnyKernel3
          zip -r9 "$GITHUB_WORKSPACE/SukiSU-SUSFS-Kernel-OP9P.zip" * -x README.md '*placeholder'
          zip -T "$GITHUB_WORKSPACE/SukiSU-SUSFS-Kernel-OP9P.zip"
          unzip -tqq "$GITHUB_WORKSPACE/SukiSU-SUSFS-Kernel-OP9P.zip"

          # 打包后确认刷写关键内容齐全，不允许只生成 Image 的旧 ZIP。
          unzip -Z1 "$GITHUB_WORKSPACE/SukiSU-SUSFS-Kernel-OP9P.zip" > "$GITHUB_WORKSPACE/zip_contents.txt"
          grep -qx "Image" "$GITHUB_WORKSPACE/zip_contents.txt"
          grep -qx "vendor_dlkm.img" "$GITHUB_WORKSPACE/zip_contents.txt"
          grep -qx "anykernel.sh" "$GITHUB_WORKSPACE/zip_contents.txt"
          grep -qx "vendor_ramdisk/ramdisk/lib/modules/modules.load.recovery" "$GITHUB_WORKSPACE/zip_contents.txt"
          for module in adsp_loader_dlkm.ko apr_dlkm.ko msm_drm.ko q6_notifier_dlkm.ko q6_pdr_dlkm.ko snd_event_dlkm.ko; do
            grep -qx "vendor_ramdisk/ramdisk/lib/modules/$module" "$GITHUB_WORKSPACE/zip_contents.txt" || {
              echo "刷机包缺少 Recovery 模块: $module"
              exit 1
            }
          done
          for module in qca_cld3_wlan.ko; do
            grep -q "$module" "$GITHUB_WORKSPACE/vendor_dlkm_root/lib/modules/modules.dep" || { echo "vendor_dlkm 缺少 QCA 模块依赖记录: $module"; exit 1; }
          done
          grep -q "BLOCK=/dev/block/bootdevice/by-name/vendor_boot" anykernel.sh
          grep -q "flash_generic vendor_dlkm" tools/ak3-core.sh

      # 10. 上传完整刷机包
      - name: "10. Upload Build Artifact"
        uses: actions/upload-artifact@v7
        with:
          name: SukiSU-SUSFS-Full-Build
          path: SukiSU-SUSFS-Kernel-OP9P.zip
          archive: false
